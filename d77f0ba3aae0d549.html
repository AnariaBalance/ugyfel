<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"></head><body><title>Anaria Balance · számlaforgalom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
/* Layout: cégügyfél számlaforgalom – kulcsszámok, havi diagram, havi tábla, top vevők/szállítók */
:root{
  --bg:#f4f6f7; --surface:#ffffff; --ink:#15232b; --ink-2:#4a5a63; --muted:#76858d;
  --line:#dde3e6; --accent:#1d5d6b; --accent-soft:#dbe9ec; --warn:#9c4f17; --warn-soft:#f6e7d9; --good:#2e6b3f; --good-soft:#e1efe4;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#16222a; --ink:#e5ecef; --ink-2:#a9b8bf; --muted:#7f9098;
  --line:#26363f; --accent:#6cb6c4; --accent-soft:#1c3940; --warn:#e3a06a; --warn-soft:#3a2a1d; --good:#7cc08e; --good-soft:#1c3324; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#16222a; --ink:#e5ecef; --ink-2:#a9b8bf; --muted:#7f9098;
  --line:#26363f; --accent:#6cb6c4; --accent-soft:#1c3940; --warn:#e3a06a; --warn-soft:#3a2a1d; --good:#7cc08e; --good-soft:#1c3324; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.firm{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,5vw,40px);line-height:1.12;margin:4px 0 6px;text-wrap:balance}
h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:0 0 6px}
.lead{color:var(--ink-2);margin:0 0 14px;max-width:68ch;font-size:14.5px}
.sub{color:var(--ink-2);margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.lock{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:16px}
.lock form{display:flex;flex-direction:column;gap:10px}
.lock label{font-size:13px;color:var(--ink-2)}
.lock input{font:inherit;font-family:var(--f-num);padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:11px 14px;border:0;border-radius:6px;background:var(--accent);color:var(--surface);cursor:pointer}
details.ux{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:10px 0}
details.ux > summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:15px;list-style:none;display:flex;gap:8px;align-items:center}
details.ux > summary::-webkit-details-marker{display:none}
details.ux > summary::before{content:"▸";color:var(--accent);transition:transform .15s;display:inline-block}
details.ux[open] > summary::before{transform:rotate(90deg)}
details.ux > summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.ux > :not(summary){margin:0 12px 12px}
.note-bank{margin:4px 0 12px;padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:13.5px}
.bankmiss{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--warn-soft);font-size:14px}
.bankmiss b{color:var(--warn)}
.bankmiss.ok{border-left-color:var(--good);background:var(--good-soft)}
.bankmiss.ok b{color:var(--good)}
.err{color:var(--warn);font-size:14px;min-height:1.4em;margin:0}
.note{font-size:13px;color:var(--muted)}
/* next payment */
.next{display:grid;grid-template-columns:1fr auto;gap:6px 24px;align-items:end;padding:20px 22px;background:var(--accent-soft);border-radius:10px}
.next .lbl{font-size:13px;color:var(--ink-2);grid-column:1/-1}
.next .date{font-family:var(--f-display);font-size:clamp(24px,4.4vw,32px);line-height:1.1}
.next .amt{font-family:var(--f-num);font-size:clamp(22px,4vw,28px);font-weight:500;text-align:right;white-space:nowrap}
.next .det{grid-column:1/-1;font-size:13.5px;color:var(--ink-2);margin:4px 0 0}
@media (max-width:520px){.next{grid-template-columns:1fr}.next .amt{text-align:left}}
/* monthly contribution */
.pay{display:flex;flex-direction:column;gap:12px;margin-top:-14px}
.pcard{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px 22px;display:flex;flex-direction:column;gap:10px}
.pcard .t{font-weight:600;font-size:15px}
.pcard p{margin:0;font-size:13.5px;color:var(--ink-2);max-width:70ch}
.prow{display:grid;grid-template-columns:minmax(110px,1fr) 140px 250px;gap:4px 18px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow .lbl{font-size:14px}
.prow .amt{font-family:var(--f-num);font-size:17px;font-weight:500;white-space:nowrap;text-align:right}
.prow.sum .lbl{font-weight:600}
.prow.sum .amt{font-size:20px}
.acct{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:0}
.acct code{font-family:var(--f-num);font-size:13px;color:var(--ink-2);user-select:all;white-space:nowrap}
.cp{font:inherit;font-size:12px;font-weight:600;padding:4px 9px;border-radius:5px;background:var(--accent-soft);color:var(--accent);border:0;cursor:pointer}
.memo{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--ink-2)}
.memo code{font-family:var(--f-num);color:var(--ink);user-select:all}
.qd summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.qlist{display:flex;flex-direction:column;margin-top:8px}
.qrow{display:grid;grid-template-columns:minmax(120px,1fr) 140px 250px;gap:4px 18px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.qrow small{color:var(--muted);font-size:12px}
.qrow .amt{font-family:var(--f-num);text-align:right;white-space:nowrap}
.qrow .due{font-size:12.5px;color:var(--ink-2);text-align:right}
@media (max-width:620px){.qrow{grid-template-columns:1fr auto}.qrow .due{grid-column:1/-1;text-align:left}}
@media (max-width:620px){.prow{grid-template-columns:1fr auto}.prow .acct{grid-column:1/-1;justify-content:flex-start}}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tile{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tile .v{font-family:var(--f-num);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .h{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--good-soft);color:var(--good)}
/* meters */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.meter{display:flex;flex-direction:column;gap:8px;min-width:0}
.meter .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.meter .t{font-weight:600;font-size:14.5px}
.meter .top .num{font-size:12.5px;color:var(--ink-2)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar i.over{background:var(--warn)}
.meter p{margin:0;font-size:13.5px;color:var(--ink-2)}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-115%)}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;background:var(--bg)}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.lbl{font-family:var(--f-body)}
td.txt{font-family:var(--f-body);white-space:normal;min-width:150px;text-align:left}
td small{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--bg);border-top:1px solid var(--line);border-bottom:0}
.two{display:grid;gap:22px}
.qx{font:inherit;font-weight:500;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;text-align:left}
.qx::before{content:"▸";font-size:11px;transition:transform .15s;display:inline-block}
.qx[aria-expanded="true"]::before{transform:rotate(90deg)}
tr.mr td{background:var(--bg);font-size:13.5px;color:var(--ink-2)}
tr.mr td.lbl{padding-left:30px}
tr.ml > td{background:var(--bg);padding:4px 12px 12px 48px}
.il{width:100%;border-collapse:collapse;font-size:12.5px}
.il th,.il td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--line);font-weight:400;color:var(--ink-2)}
.il th{font-size:11.5px;color:var(--muted)}
.il th:nth-child(-n+2),.il td:nth-child(-n+2){text-align:left}
.il td.v{white-space:normal}
.il tfoot td{text-align:left;color:var(--warn);border-bottom:0}
@media (max-width:640px){tr.ml > td{padding-left:12px}.il th:nth-child(3),.il td:nth-child(3){display:none}}
.mark{color:var(--warn)}
@media (max-width:560px){.hide-n{display:none}}
h3{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--ink)}
h3.gap{margin-top:22px}
.foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:18px}
.foot p{margin:0;max-width:72ch}
.foot strong{color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s ease}}

.note-box{padding:14px 18px;border-radius:8px;background:var(--accent-soft);font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.note-box p{margin:0;max-width:75ch}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:0 0 10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.c-out{background:var(--accent)} .c-in{background:var(--muted)}
td .sh{display:flex;align-items:center;gap:8px;justify-content:flex-end}
td .sh b{display:block;height:6px;border-radius:3px;background:var(--accent);opacity:.55}
td.neg{color:var(--warn)}
tr.cur td{color:var(--ink-2)}
@media (max-width:560px){td .sh b{display:none}}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.blist{display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:16px 18px}
.bl{display:flex;flex-direction:column;gap:6px;min-width:0}
.bl-t{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14.5px;font-weight:500}
.bl-t .num{font-size:14px;white-space:nowrap}
.bl-t small{color:var(--muted);font-weight:400;margin-left:6px}
.bl-s{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.bl-s .num{font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;margin:0 0 10px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);min-width:130px}
.filters label.grow{flex:1 1 220px}
.filters select,.filters input{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fsum{font-size:13.5px;color:var(--ink-2);margin:0 0 10px}
.fsum .num{color:var(--ink)}
table.lines td.txt{min-width:200px}
table.lines td{vertical-align:top}
table.lines tr.ri td.lbl small{color:var(--warn)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.pager button{font-size:13.5px;padding:8px 12px;background:var(--accent-soft);color:var(--accent)}
.pager button:disabled{opacity:.45;cursor:default}
.tiles + h3.gap{margin-top:22px}
</style>

<div id="lock" class="lock">
  <div>
    <div class="firm">Anaria Balance Kft.</div>
    <h1>2026. évi számlaforgalom</h1>
    <p class="sub"><b>Nettó árbevétel, költségek és számlasor-statisztika</b></p>
    <p class="sub">Ez az oldal jelszóval védett. A jelszót tőlünk kapod meg.</p>
  </div>
  <form id="f" autocomplete="off">
    <label for="pw">Jelszó</label>
    <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" required>
    <button type="submit" id="go">Megnyitás</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="note">Az adatok titkosítva vannak, és csak a te böngésződben nyílnak meg a jelszóval.</p>
</div>

<main id="app" class="wrap" hidden></main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Megnyitás…"; err.textContent = "";
  let data;
  try { data = await decrypt(document.getElementById("pw").value.trim()); }
  catch(x){ err.textContent = "Hibás jelszó. Ellenőrizd, majd próbáld újra."; btn.disabled = false; btn.textContent = "Megnyitás"; return; }
  render(data);
});
const nf = n => Math.round(n).toLocaleString("hu-HU").replace(/ /g," ");
const ft = n => nf(n) + " Ft";
const nq = n => n == null ? "" : (Math.round(n*10)/10).toLocaleString("hu-HU").replace(/ /g," ");
const HU_M = ["jan.","febr.","márc.","ápr.","máj.","jún.","júl.","aug.","szept.","okt.","nov.","dec."];
const HU_MF = ["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
const hdLong = s => { const [y,m,d] = s.split("-"); return `${y}. ${HU_MF[+m-1]} ${+d}.`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a,b) => b ? (a/b*100).toLocaleString("hu-HU",{maximumFractionDigits:1}) + "%" : "–";
const sum = a => a.reduce((x,y)=>x+y,0);
const fold = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function partnerTable(title, list, rest, restN, total, who){
  const max = Math.max(...list.map(x=>x.osszeg), 1);
  return `<div class="tbl"><table>
    <thead><tr><th>${title}</th><th class="hide-n">Számla</th><th>Nettó összeg</th><th>Arány</th></tr></thead>
    <tbody>${list.map(x=>`<tr><td class="txt">${esc(x.nev)}</td><td class="hide-n">${x.db} db</td><td>${nf(x.osszeg)}</td><td><span class="sh"><b style="width:${Math.max(4,Math.round(x.osszeg/max*70))}px"></b>${pct(x.osszeg,total)}</span></td></tr>`).join("")}
    <tr><td class="txt">Többi ${restN} ${who}</td><td class="hide-n"></td><td>${nf(rest)}</td><td>${pct(rest,total)}</td></tr></tbody>
    <tfoot><tr><td class="lbl">Összesen</td><td class="hide-n"></td><td>${nf(total)}</td><td>100%</td></tr></tfoot>
  </table></div>`;
}

function blist(items, total, subFn){
  const max = Math.max(...items.map(x=>x.t), 1);
  return `<div class="blist">${items.map(x=>`<div class="bl">
    <div class="bl-t"><span>${esc(x.c)}</span><span class="num">${ft(x.t)} <small>${pct(x.t,total)}</small></span></div>
    <div class="bar"><i style="width:${Math.max(0.5, x.t/max*100)}%"></i></div>
    ${subFn ? `<div class="bl-s">${subFn(x)}</div>` : ""}
  </div>`).join("")}</div>`;
}

  const Q = [0,1,2,3].map(q=>rows.filter(r=>Math.floor(r.i/3)===q)).filter(a=>a.length);

    <p><b>Mit látsz itt?</b> Az összes idén kiállított és befogadott számládat, tételsorról tételsorra összeadva, nettó összegben, a teljesítés dátuma szerint. Ez a számlaforgalom, nem a könyvelt eredmény: a bérek, járulékok, adók, a számla nélküli költségek és az értékcsökkenés nincsenek benne.</p>
    <p>Az ${HU_MF[cur]} még tart, és a szállítói számlák egy része csak napokkal később érkezik meg, ezért ez a hónap még változni fog.</p>

  <section class="tiles" aria-label="Összesítés">

    <div class="tile"><span class="k">Nettó beszerzés, költség</span><span class="v">${ft(totIn)}</span><span class="h">${nIn} szállítói számla</span></div>
    <div class="tile"><span class="k">Különbözet</span><span class="v">${ft(diff)}</span><span class="h">az árbevétel ${pct(diff,totOut)}-a; nem azonos a nyereséggel</span></div>
    <div class="tile"><span class="k">Kiszámlázott munkaóra</span><span class="v">${nf(labH)} óra</span><span class="h">átlag ${ft(labAvg)}/óra · ${ft(labN)} munkadíj</span></div>
  </section>

  <section>
    <h2>Árbevétel és költség havonta</h2>
    <p class="lead">Nettó összegek a teljesítés hónapja szerint. Vidd az egeret (vagy koppints) egy hónapra a pontos összegekért.</p>
    <div class="legend"><span><i class="c-out"></i>Nettó árbevétel (kimenő)</span><span><i class="c-in"></i>Nettó költség (bejövő)</span></div>
    <div class="chart" id="chart"></div>
  </section>

  <section>
    <h2>Havi bontás</h2>
    <p class="lead">A jóváíró (mínuszos) számlák levonva szerepelnek abban a hónapban, amelyre a teljesítésük esik. A legerősebb lezárt hónap: ${HU_MF[best]}; a havi átlag január–${HU_MF[cur-1]} ${ft(avgOut)}.</p>
    <div class="tbl"><table>
      <thead><tr><th>Hónap</th><th class="hide-n">Kimenő db</th><th>Árbevétel</th><th class="hide-n">Bejövő db</th><th>Költség</th><th>Különbözet</th><th class="hide-n">Munkaóra</th></tr></thead>
      <tbody>${Q.map((qs,q)=>qs.map(r=>`<tr class="${r.i===cur?"cur":""}"><td class="lbl">${HU_MF[r.i]}${r.i===cur?"<small>még tart</small>":""}</td><td class="hide-n">${r.oc}</td><td>${nf(r.o)}</td><td class="hide-n">${r.ic}</td><td>${nf(r.n)}</td><td class="${r.k<0?"neg":""}">${nf(r.k)}</td><td class="hide-n">${nq(r.h)}</td></tr>`).join("")
        + (qs.length===3 ? `<tr class="mr"><td class="lbl">${["I.","II.","III.","IV."][q]} negyedév</td><td class="hide-n">${sum(qs.map(r=>r.oc))}</td><td>${nf(sum(qs.map(r=>r.o)))}</td><td class="hide-n">${sum(qs.map(r=>r.ic))}</td><td>${nf(sum(qs.map(r=>r.n)))}</td><td>${nf(sum(qs.map(r=>r.k)))}</td><td class="hide-n">${nq(sum(qs.map(r=>r.h)))}</td></tr>` : "")).join("")}</tbody>
      <tfoot><tr><td class="lbl">Összesen</td><td class="hide-n">${nOut}</td><td>${nf(totOut)}</td><td class="hide-n">${nIn}</td><td>${nf(totIn)}</td><td>${nf(diff)}</td><td class="hide-n">${nq(labH)}</td></tr></tfoot>
    </table></div>
  </section>

  <section>
    <h2>Miből jön az árbevétel</h2>
    <p class="lead">A kimenő számlák ${nf(d.nlines.O)} tételsora négy csoportba sorolva. Munkadíj az óra mértékegységű sor; a „(K)” jelű és a javítás, felújítás, vizsga, ügyintézés megnevezésű sor külső javítás, ügyintézés.</p>

  </section>

  <section>
    <h2>Munkadíj</h2>
    <p class="lead">${nf(labH)} kiszámlázott munkaóra, átlagosan ${ft(labAvg)}/óra. A munkaórák ${pct(pc[1],labH)}-a a ${esc(pc[0])} javításaira esik, átlagosan ${ft(pc[2]/pc[1])}/óra áron.</p>
    <div class="two">
      <div><h3>Óradíjanként</h3><div class="tbl"><table>
        <thead><tr><th>Óradíj (nettó)</th><th>Óra</th><th>Munkadíj</th><th>Arány</th></tr></thead>

      <div><h3>Vevőnként (a 10 legtöbb óra)</h3><div class="tbl"><table>
        <thead><tr><th>Vevő</th><th>Óra</th><th class="hide-n">Munkadíj</th><th>Átlag Ft/óra</th></tr></thead>
        <tbody>${d.lab.cust.map(r=>`<tr><td class="txt">${esc(r[0])}</td><td>${nq(r[1])}</td><td class="hide-n">${nf(r[2])}</td><td>${nf(r[2]/r[1])}</td></tr>`).join("")}</tbody>
      </table></div></div>
    </div>
    <h3 class="gap">A leggyakoribb munkák</h3>
    <div class="tbl"><table>
      <thead><tr><th>Munka megnevezése</th><th class="hide-n">Sor</th><th>Óra</th><th>Munkadíj</th></tr></thead>
      <tbody>${d.lab.items.map(r=>`<tr><td class="txt">${esc(r.t)}</td><td class="hide-n">${r.c}</td><td>${nq(r.h)}</td><td>${nf(r.n)}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>

  <section>
    <h2>Mire mennek a költségek</h2>
    <p class="lead">A bejövő számlák ${nf(d.nlines.I)} tételsora a szállító tevékenysége szerint csoportosítva, a csoport legnagyobb szállítóival.</p>
    ${blist(d.costcat, totIn, x=>x.sup.map(s=>`${esc(s[0])} <span class="num">${nf(s[1])}</span>`).join(" · ") + (x.nsup>4 ? ` · és még ${x.nsup-4}` : ""))}
  </section>

  <section>
    <h2>Legnagyobb vevőid</h2>
    <p class="lead">Kiknek számláztál a legtöbbet idén, nettóban. A legnagyobb vevőd, a ${esc(top1.nev)} egymaga az árbevétel ${pct(top1.osszeg,totOut)}-át adja.</p>
    ${partnerTable("Vevő", d.top_v, d.rest_v, d.rest_v_n, totOut, "vevő")}
  </section>

  <section>
    <h2>Legnagyobb szállítóid</h2>
    <p class="lead">Kiktől vásároltál a legtöbbet idén, nettóban. Az összegekből a visszáru és a jóváírások már le vannak vonva.</p>
    ${partnerTable("Szállító", d.top_s, d.rest_s, d.rest_s_n, totIn, "szállító")}
  </section>

  <section>
    <h2>Alkatrész és anyag: vétel és eladás</h2>
    <p class="lead">Alkatrészt és anyagot ${ft(matSold)} értékben számláztál tovább, és ${ft(matBought)} értékben vásároltál (visszáruval csökkentve). A különbözet ${ft(matSold-matBought)}, az eladás ${pct(matSold-matBought,matSold)}-a. A külső javításokat és ügyintézést ${ft(extSold)} értékben számláztad tovább; az alvállalkozók és a vizsgaállomások ${ft(extCost)}-ot számláztak neked.</p>
    <div class="tiles">
      <div class="tile"><span class="k">Motorolaj</span><span class="v">${nf(d.oil.bl)} l vétel</span><span class="h">vétel átlag ${ft(oilB)}/l · eladás ${nf(d.oil.sl)} l, átlag ${ft(oilS)}/l</span></div>
      <div class="tile"><span class="k">Üzemanyag (tankolás)</span><span class="v">${nf(fuelL)} l</span><span class="h">${ft(fuelN)} nettó · átlag ${ft(fuelN/fuelL)}/l</span></div>
      <div class="tile"><span class="k">Visszáru, jóváírás</span><span class="v">${ft(-d.ret.n)}</span><span class="h">${d.ret.c} visszáru sor · a vásárolt alkatrész ${pct(-d.ret.n,d.ret.pos)}-a</span></div>
    </div>
    <h3 class="gap">Termékcsoportonként</h3>
    <p class="lead">A csoport a tételsor megnevezéséből adódik. A szállítók és a te számláid gyakran mást írnak ugyanarra az alkatrészre (például „Gyári alkatrész”), és a készlet is áthúzódhat hónapok között, ezért a csoportonkénti különbözet csak tájékoztató.</p>
    <div class="tbl"><table>
      <thead><tr><th>Termékcsoport</th><th>Eladva (nettó)</th><th>Vásárolva (nettó)</th><th class="hide-n">Különbözet</th></tr></thead>
      <tbody>${grpRows.map(x=>`<tr><td class="lbl">${esc(x.g)}</td><td>${nf(x.sold)}</td><td>${nf(x.bought)}</td><td class="hide-n ${x.sold-x.bought<0?"neg":""}">${nf(x.sold-x.bought)}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td class="lbl">Összesen</td><td>${nf(sum(grpRows.map(x=>x.sold)))}</td><td>${nf(sum(grpRows.map(x=>x.bought)))}</td><td class="hide-n">${nf(sum(grpRows.map(x=>x.sold-x.bought)))}</td></tr></tfoot>
    </table></div>
  </section>

  <section>
    <h2>A legnagyobb eladott tételek</h2>
    <p class="lead">A kimenő számlák tételei megnevezés szerint összevonva, a munkadíj nélkül. Az átlagár egy egységre jutó nettó eladási ár.</p>
    <div class="tbl"><table>
      <thead><tr><th>Megnevezés</th><th>Mennyiség</th><th>Nettó</th><th class="hide-n">Átlagár</th></tr></thead>
      <tbody>${d.top_sold.map(r=>`<tr><td class="txt">${esc(r.t)}<small>${r.c} számlasor</small></td><td>${nq(r.q)} ${esc(r.u)}</td><td>${nf(r.n)}</td><td class="hide-n">${r.p==null?"":nf(r.p)}</td></tr>`).join("")}</tbody>
    </table></div>
    <h3 class="gap">A legnagyobb vásárolt tételek</h3>
    <div class="tbl"><table>
      <thead><tr><th>Megnevezés</th><th>Mennyiség</th><th>Nettó</th><th class="hide-n">Átlagár</th></tr></thead>
      <tbody>${d.top_bought.map(r=>`<tr><td class="txt">${esc(r.t)}<small>${esc(r.s)} · ${r.c} számlasor</small></td><td>${nq(r.q)}</td><td>${nf(r.n)}</td><td class="hide-n">${r.p==null?"":nf(r.p)}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>

  <section>
    <h2>Az összes számlasor</h2>
    <p class="lead">Mind a ${nf(d.R.length)} tételsor, kereshetően. Szűrhetsz irányra, hónapra, és kereshetsz megnevezésre, partnerre vagy számlaszámra.</p>
    <div class="filters">
      <label>Irány<select id="fd"><option value="">Mind</option><option value="O">Kimenő</option><option value="I">Bejövő</option></select></label>
      <label>Hónap<select id="fm"><option value="">Egész év</option>${HU_MF.slice(0,d.cur_m).map((m,i)=>`<option value="${String(i+1).padStart(2,"0")}">${m}</option>`).join("")}</select></label>
      <label class="grow">Keresés<input id="fq" type="search" placeholder="pl. fékbetét, Unix, 2026-123" autocomplete="off"></label>
    </div>
    <p class="fsum" id="fs" aria-live="polite"></p>
    <div class="tbl"><table class="lines">
      <thead><tr><th>Dátum</th><th>Megnevezés</th><th>Menny.</th><th>Nettó</th></tr></thead>
      <tbody id="lb"></tbody>
    </table></div>
    <div class="pager"><button type="button" id="pp">‹ Előző</button><span id="pi"></span><button type="button" id="pn">Következő ›</button></div>
  </section>

  <footer class="foot">
    <p><strong>Honnan vannak az adatok?</strong> A NAV Online Számla rendszerébe beküldött számláid tételsoraiból, amelyeket az ÜgyfélSegéd gyűjt össze. A havi besorolás a teljesítés dátuma szerint történik, ahogy az ÁFA-bevallásban is. A tankolási nyugtákon csak bruttó összeg szerepel, ezeknél a nettót a 27%-os ÁFA visszaszámolásával kaptuk.</p>
    <p><strong>Miért nem ez a nyereség?</strong> A tényleges eredményhez a bérköltség, a járulékok, az adók és az értékcsökkenés is kell, és a készletváltozás is számít. Ezt a könyvelés zárása után tudjuk megmondani.</p>
    <p>Kérdésed van valamelyik számmal kapcsolatban? Írj nekünk bátran.</p>
  </footer>`;

  const lk = document.getElementById("lock"); if (lk) lk.hidden = true;
  document.getElementById("app").hidden = false;
  drawChart(d);
  setupLines(d);
  let t; window.addEventListener("resize", ()=>{ clearTimeout(t); t = setTimeout(()=>drawChart(d), 150); });
}

function setupLines(d){
  const P = d.P, R = d.R, PER = 50;
  const keys = R.map(r => fold(r[4] + " " + P[r[3]] + " " + r[2]));
  const st = {dir:"", m:"", q:"", page:0};
  let hit = [];
  const $ = id => document.getElementById(id);
  function apply(){
    const qs = fold(st.q).split(/\s+/).filter(Boolean);
    hit = [];
    for (let i=0;i<R.length;i++){
      const r = R[i];
      if (st.dir && r[0]!==st.dir) continue;
      if (st.m && r[1].slice(0,2)!==st.m) continue;
      if (qs.length && !qs.every(w=>keys[i].includes(w))) continue;
      hit.push(i);
    }
    let so = 0, si = 0;
    for (const i of hit){ if (R[i][0]==="O") so += R[i][7]; else si += R[i][7]; }
    $("fs").innerHTML = `<b>${nf(hit.length)}</b> sor · kimenő nettó <span class="num">${ft(so)}</span> · bejövő nettó <span class="num">${ft(si)}</span>`;
    st.page = Math.min(st.page, Math.max(0, Math.ceil(hit.length/PER)-1));
    draw();
  }
  function draw(){
    const pages = Math.max(1, Math.ceil(hit.length/PER));
    const sl = hit.slice(st.page*PER, st.page*PER+PER);
    $("lb").innerHTML = sl.length ? sl.map(i=>{ const r = R[i], [mm,dd] = r[1].split("-");
      return `<tr class="${r[0]==="O"?"ro":"ri"}"><td class="lbl">${HU_M[+mm-1]} ${+dd}.<small>${r[0]==="O"?"kimenő":"bejövő"}</small></td><td class="txt">${esc(r[4])}<small>${esc(P[r[3]])} · ${esc(r[2])}</small></td><td>${r[5]==null?"":nq(r[5])+" "+esc(r[6])}</td><td class="${r[7]<0?"neg":""}">${nf(r[7])}</td></tr>`; }).join("")
      : `<tr><td colspan="4" class="txt">Nincs találat ezekkel a feltételekkel.</td></tr>`;
    $("pi").textContent = `${st.page+1} / ${pages}. oldal`;
    $("pp").disabled = st.page===0; $("pn").disabled = st.page>=pages-1;
  }
  let tq;
  $("fd").addEventListener("change", e=>{ st.dir = e.target.value; st.page = 0; apply(); });
  $("fm").addEventListener("change", e=>{ st.m = e.target.value; st.page = 0; apply(); });
  $("fq").addEventListener("input", e=>{ clearTimeout(tq); tq = setTimeout(()=>{ st.q = e.target.value; st.page = 0; apply(); }, 150); });
  $("pp").addEventListener("click", ()=>{ st.page--; draw(); });
  $("pn").addEventListener("click", ()=>{ st.page++; draw(); });
  apply();
}

function drawChart(d){
  const el = document.getElementById("chart");
  const cur = d.cur_m - 1;
  const ms = d.out_m.map((o,i)=>({i, o, n:d.in_m[i]}));
  const W = Math.max(320, Math.min(900, el.clientWidth || 760)), narrow = W < 560;
  const H = narrow ? 230 : 270, L = narrow ? 40 : 56, R = 6, T = 14, B = 28;
  const max = Math.max(...ms.map(m=>Math.max(m.o,m.n)), 1);
  const step = [1e6,2e6,2.5e6,5e6,1e7].find(s=>max/s<=6) || 2e7;
  const top = Math.ceil(max/step)*step;
  const y = v => T + (H-T-B)*(1-v/top);
  const bw = (W-L-R)/ms.length, w = Math.min(18, bw*0.32), gap = 2;
  const fmt = v => v===0 ? "0" : (v/1e6).toLocaleString("hu-HU")+" M";
  const bar = (x0, v, fill, op) => { const h = Math.max(0, y(0)-y(v)); if(!h) return ""; const r = Math.min(3, h/2), y0 = y(v);
    return `<path d="M${x0},${y(0)} V${y0+r} Q${x0},${y0} ${x0+r},${y0} H${x0+w-r} Q${x0+w},${y0} ${x0+w},${y0+r} V${y(0)} Z" fill="${fill}" opacity="${op}"/>`; };
  let g = "";
  for(let v=0; v<=top+1; v+=step){
    g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-num)">${fmt(v)}</text>`;
  }
  ms.forEach((m,k)=>{
    const cx = L + bw*k + bw/2, op = m.i===cur ? 0.5 : 1;
    g += `<g class="b" data-k="${k}" tabindex="0"><rect x="${L+bw*k}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>${bar(cx-w-gap/2, m.o, "var(--accent)", op)}${bar(cx+gap/2, m.n, "var(--muted)", op)}<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="${narrow?10:11.5}" fill="var(--ink-2)">${HU_M[m.i]}</text></g>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Havi nettó árbevétel és költség oszlopdiagram">${g}</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.querySelectorAll("g.b").forEach(b=>{
    const k = +b.dataset.k, m = ms[k];
    const show = ()=>{ const s = svg.getBoundingClientRect().width/W;
      tip.innerHTML = `<b>${HU_MF[m.i]}</b>${m.i===cur?" (eddig)":""}<br>Árbevétel: ${ft(m.o)}<br>Költség: ${ft(m.n)}`;
      tip.style.left = Math.min(Math.max((L+bw*k+bw/2)*s, 90), svg.getBoundingClientRect().width-90)+"px"; tip.style.top = y(Math.max(m.o,m.n))*s+"px"; tip.hidden = false; };
    b.addEventListener("mouseenter", show); b.addEventListener("focus", show); b.addEventListener("click", show);
    b.addEventListener("mouseleave", ()=>tip.hidden = true); b.addEventListener("blur", ()=>tip.hidden = true);
  });
}

</script>
