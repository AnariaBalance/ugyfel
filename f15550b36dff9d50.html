const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Megnyitás…"; err.textContent = "";
  let data;
  try { data = await decrypt(document.getElementById("pw").value.replace(/\D/g,"")); }
  catch(x){ err.textContent = "Hibás jelszó. Ellenőrizd, és próbáld újra."; btn.disabled = false; btn.textContent = "Megnyitás"; return; }
  render(data);
});

const nf = n => { if (n==null) return "–"; const v = Math.round(n), s = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g," "); return (v<0?"−":"") + s; };
const ft = n => nf(n) + " Ft";
const HU_M = ["jan.","febr.","márc.","ápr.","máj.","jún.","júl.","aug.","szept.","okt.","nov.","dec."];
const HU_MF = ["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
const hd = s => s ? s.replace(/-/g,". ")+"." : "–";
const hdLong = s => { if(!s) return "–"; const [y,m,d] = s.split("-"); return `${y}. ${HU_MF[+m-1]} ${+d}.`; };
const per = p => { const m = /^(\d{4})-(\d{2})$/.exec(p||""); return m ? `${m[1]}. ${HU_MF[+m[2]-1]}` : (p||"").replace(/(\d)\. n\.év/,"$1. negyedév"); };
const QN = ["I.","II.","III.","IV."];
const hdS = (s, suf) => { if(!s) return "–"; const [y,m,d] = s.split("-"); return `${y}. ${HU_MF[+m-1]} ${+d}-${suf}`; };
const yIn = y => y + "-" + ("368".includes(String(y).slice(-1)) || String(y).endsWith("0") ? "ban" : "ben");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const neg = v => v < 0 ? ' class="neg"' : "";

// KapuSegéd: adószámla-egyenleg (NAV + önkormányzat), befizetendők, dolgozók
function kapuParts(d){
  const K = d.kapu; if (!K) return null;
  const memo8 = (d.adoszam||"").replace(/\D/g,"").slice(0,8);
  const acctC = n => n ? `<span class="acct"><code>${n}</code><button class="cp" data-copy="${n}">Másol</button></span>` : "<span></span>";
  const bal = v => v>0 ? `<span class="num neg">${ft(v)}</span><small class="bl">tartozás</small>` : `<span class="num pos">${ft(-v)}</span><small class="bl">túlfizetés</small>`;
  const navRows = K.nav ? K.nav.items.map(x=>`<div class="krow"><span>${esc(x.no?x.no+" ":"")}${esc(x.name)}</span><span class="kv">${bal(x.balance)}</span>${x.balance>0?acctC(x.acct):"<span></span>"}</div>`).join("") : "";
  const onkRows = (K.onk||[]).map(o=>`<h3>${esc(o.onk)} · ${o.year}</h3>${o.items.map(x=>`<div class="krow"><span>${esc(x.name)}</span><span class="kv">${bal(x.balance)}</span>${x.balance>0?acctC(x.acct):"<span></span>"}</div>`).join("")}`).join("");
  const adoszBody = `<p class="lead">A NAV adófolyószámla és az önkormányzati adószámlák egyenlege adónemenként. A pozitív összeg tartozás, a túlfizetés zölddel látszik. ${K.debt>0?"A tartozást a megadott számlaszámra utald, a közleménybe a cég adószámának első 8 számjegyét írd.":""}</p>
    <h3>NAV</h3>${K.nav ? (navRows || `<p class="ok">A NAV-adószámlán nincs tartozás és túlfizetés.</p>`) : `<p class="note">A NAV-adószámla kivonata még nincs letöltve.</p>`}
    ${onkRows ? `<h3 class="sp">Önkormányzat</h3>${onkRows}` : ""}
    ${K.missing_decl&&K.missing_decl.length?`<p class="note">A NAV szerint hiányzó bevallás: ${K.missing_decl.map(x=>`${esc(x.name)} (${esc(x.period)})`).join("; ")}. Ezt mi rendezzük.</p>`:""}
    ${memo8&&K.debt>0?`<div class="memo">Közlemény: <code>${memo8}</code> <button class="cp" data-copy="${memo8}">Másol</button></div>`:""}
    <p class="note">Forrás: NAV és önkormányzati adószámla-kivonat (${hdS((K.nav&&K.nav.updated||K.onk_updated||K.fetched||"").slice(0,10),"i")} állapot).</p>`;
  const E = K.employees||[];
  const dolgBody = `<p class="lead">A NAV-hoz bejelentett biztosítottak (dolgozók, társas vállalkozók) ${hdS(K.fetched,"i")} állapot szerint.${K.efo_count?` Ezen felül ${K.efo_count} egyszerűsített foglalkoztatott (alkalmi munkavállaló) szerepel a NAV nyilvántartásában.`:""}</p>
    ${E.length?`<div class="tbl"><table><thead><tr><th style="text-align:left">Név</th><th style="text-align:left">Jogviszony</th><th>Kezdete</th><th class="hide-n">Vége</th><th class="hide-n">Heti óra</th><th style="text-align:left" class="hide-n">Munkakör (FEOR)</th></tr></thead><tbody>
      ${E.map(e=>`<tr><td class="txt">${esc(e.name)}${e.hibas?' <small class="neg">bejelentés hibás</small>':""}</td><td class="txt"><small>${esc(e.jogv)}</small></td><td>${hd(e.start)}</td><td class="hide-n">${e.end?hd(e.end):"–"}</td><td class="hide-n">${e.ora??"–"}</td><td class="txt hide-n"><small>${esc(e.feor||"–")}</small></td></tr>`).join("")}
    </tbody></table></div>`:`<p class="note">Nincs bejelentett biztosított.</p>`}`;
  return {adoszBody, adoszVal: K.debt>0 ? `${ft(K.debt)} tartozás` : "nincs tartozás", adoszNeg: K.debt>0, dolgBody, dolgVal: `${E.length} fő${K.efo_count?` + ${K.efo_count} EFO`:""}`};
}

  app.innerHTML = `
  <header>
    <div class="firm">Anaria Balance Kft. · utalások áttekintése</div>

    <p class="sub">Feldolgozott bankkivonatok: ${hdS(d.utal.end,"ig")}</p>
  </header>
  <div id="v-pay" class="view">${payView(d.utal)}</div>
  ${kapuOnly(d)}
  <footer class="foot">
    <p>Ez tájékoztató összevetés a feltöltött bankkivonataid és a NAV Online Számla rendszeréből érkezett bejövő számláid alapján, nem könyvelési kimutatás. Ha valamit másképp rendeztél (készpénz, kártya, beszámítás), szólj, és javítjuk. Kérdésed van? Írj nekünk: <span class="num">anaria@anaria.hu</span></p>
  </footer>`;
  document.getElementById("lock").hidden = true; app.hidden = false;
  topScrollbars(app);
  wirePay(app, d.utal);
  wireCopy(app);
}

function kapuOnly(d){
  const KP = kapuParts(d); if (!KP) return "";
  const sec = (id, title, val, body, cls="") => `<details class="sec" id="${id}"><summary><span class="st">${title}</span><span class="sv num${cls}">${val}</span></summary><div class="sb">${body}</div></details>`;
  const up = d.upcoming || [], sum = up.reduce((a,o)=>a+o.amount,0);
  const memo8 = (d.adoszam||"").replace(/\D/g,"").slice(0,8);
  const acctC = n => n ? `<span class="acct"><code>${n}</code><button class="cp" data-copy="${n}">Másol</button></span>` : "<span></span>";
  const payB = up.length ? `<p class="lead">A NAV-adószámla és az önkormányzati adószámla-kivonatok szerint előírt tételek. A tételeket külön-külön, a saját számlájukra utald.</p><div class="pcard">
      ${up.map(o=>`<div class="prow"><span class="d">${hd(o.due)}</span><span class="lbl">${esc(o.title)}<small>${esc(o.period||"")}</small></span><span class="amt">${ft(o.amount)}</span>${acctC(o.acct)}</div>`).join("")}
      ${memo8?`<div class="memo">Közlemény minden utalásnál: <code>${memo8}</code> <button class="cp" data-copy="${memo8}">Másol</button></div>`:""}</div>`
    : `<p class="lead">A NAV- és önkormányzati adószámla szerint jelenleg nincs előírt, esedékes tétel.</p>`;
  return `<section class="kapu"><h2>Adók és dolgozók</h2><div class="secs">
    ${sec("s-adosz", "Adószámla-egyenleg (NAV, önkormányzat)", KP.adoszVal, KP.adoszBody, KP.adoszNeg?" neg":"")}
    ${sec("s-pay", "Befizetendő adók és járulékok", up.length?ft(sum):"nincs", payB)}
    ${sec("s-dolg", "Dolgozók", KP.dolgVal, KP.dolgBody)}
  </div></section>`;
}

function render(d){
  if (d.only_pay) return renderPay(d);
  const Y = d.year, M = d.months, T = d.ytd, n = M.length;
  const memo8 = (d.adoszam||"").replace(/\D/g,"").slice(0,8);
  const N = d.next;
  const lagging = !N && d.today && (new Date(d.today) - new Date(d.asOf)) / 864e5 > 35;
  const nextBlock = N ? `
  <section class="next" aria-label="Következő befizetés">
    <span class="lbl">Következő befizetés</span>
    <span class="date">${hdLong(N.due)}</span>
    <span class="amt">${ft(N.total)}</span>
    <p class="det">${N.items.map(o=>`${esc(o.title)} ${ft(o.amount)}`).join(" · ")}.</p>
    <button class="lk" data-goto="s-pay">Számlaszámok és közlemény</button>
  </section>` : `<section class="next"><span class="lbl">Következő befizetés</span><span class="date">${lagging ? "Hamarosan jelezzük" : "Nincs nyitott befizetés"}</span><span></span><p class="det">${lagging ? `A könyvelés ${hdS(d.asOf,"ig")} van lezárva, az azóta esedékes adókat és járulékokat a bevallások után külön megküldjük. A várható határidőket lent látod.` : "A lezárt könyvelés alapján jelenleg nincs esedékes adó vagy járulék."}</p></section>`;

  const acct = n => n ? `<span class="acct"><code>${n}</code><button class="cp" data-copy="${n}">Másol</button></span>` : "<span></span>";
  const up = d.upcoming || [];
  const KP = kapuParts(d);
  const cash = (d.bank||0) + (d.penztar[n-1]||0);
  const AF = (d.afa||[]);
  const afaY = AF.filter(Boolean).reduce((a,x)=>a+x.net,0);
  const sec = (id, title, val, body, cls="") => `<details class="sec" id="${id}"><summary><span class="st">${title}</span><span class="sv num${cls}">${val}</span></summary><div class="sb">${body}</div></details>`;
  // negyedéves táblázat, kattintásra havi sorokkal
  let qid = 0;
  const qTable = (heads, qRows, mRows, foot) => { const g = "g" + (qid++), nc = heads.length;
    return `<div class="tbl"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${qRows.map(([q, label, cells])=>`<tr><td class="lbl"><button class="qx" aria-expanded="false" data-g="${g}" data-q="${q}">${label}</button></td>${cells}</tr>${mRows.filter(r=>r[0]===q).map(([,ml,mc,sub],k)=>`<tr class="mr" data-g="${g}" data-q="${q}" hidden><td class="lbl">${sub?`<button class="qx mx" aria-expanded="false" data-g="${g}" data-k="${q}-${k}">${ml}</button>`:ml}</td>${mc}</tr>${sub?`<tr class="it" data-g="${g}" data-q="${q}" data-k="${q}-${k}" hidden><td colspan="${nc}">${sub}</td></tr>`:""}`).join("")}`).join("")}</tbody>
      ${foot?`<tfoot><tr>${foot}</tr></tfoot>`:""}</table></div>`; };
  const qOf = m => Math.floor((m-1)/3);
  const qs = [...new Set(M.map(m=>qOf(m.m)))];
  const qLbl = q => `${QN[q]} negyedév${M.filter(m=>qOf(m.m)===q).length<3?" <small>folyamatban</small>":""}`;

  // eredmény
  const eredBody = `<p class="lead">A teljesítés hónapja számít, nem az, hogy mikor folyt be a pénz. Kattints a negyedévre a havi bontásért.</p>
    ${qTable(["Időszak","Bevétel","Költség, ráfordítás","Eredmény"],
      d.quarters.map(Q=>[Q.q, qLbl(Q.q), `<td>${nf(Q.bev)}</td><td>${nf(Q.kolt)}</td><td${neg(Q.ered)}>${nf(Q.ered)}</td>`]),
      M.map(m=>[qOf(m.m), HU_MF[m.m-1], `<td>${nf(m.bev)}</td><td>${nf(m.kolt)}</td><td${neg(m.ered)}>${nf(m.ered)}</td>`]),
      `<td class="lbl">${Y} eddig</td><td>${nf(T.bev)}</td><td>${nf(T.kolt)}</td><td${neg(T.ered)}>${nf(T.ered)}</td>`)}
    <details class="more"><summary>Részletes eredménykimutatás soronként</summary>${detailTable(d)}</details>`;

  // pénztár és bank havonta
  const P = d.penztar, BH = d.bank_hist || [];
  const pv = i => P[i]==null ? null : P[i];
  const chg = i => { const prev = i ? pv(i-1) : d.penztar_nyito; return pv(i)==null || prev==null ? null : pv(i) - prev; };
  const qEnd = q => Math.min(q*3+2, n-1);
  const qStart = q => q*3 - 1;
  const CI = d.cash;
  const cashItems = mo => { if (!mo) return null;
    const rows = mo.items.map(t=>`<tr><td class="lbl">${hd(t.d).slice(5)}</td><td class="txt">${esc(t.p)}<small>${esc([t.b, t.megj].filter(x=>x&&x!=="rendezés"||x===t.megj).filter(Boolean).join(" · "))}</small></td><td>${t.be?nf(t.be):""}</td><td>${t.ki?nf(t.ki):""}</td><td${neg(t.e)}>${nf(t.e)}</td></tr>`).join("");
    const diff = mo.diff ? `<tr class="dif"><td class="lbl"></td><td class="txt">Egyéb könyvelt pénztármozgás<small>a főkönyvben szerepel, a pénztárjelentésben nem</small></td><td>${mo.diff>0?nf(mo.diff):""}</td><td>${mo.diff<0?nf(-mo.diff):""}</td><td></td></tr>` : "";
    if (!rows && !diff) return `<p class="note in">Ebben a hónapban nem volt pénztártétel.</p>`;
    return `<table class="items"><thead><tr><th>Nap</th><th style="text-align:left">Partner, bizonylat</th><th>Bevétel</th><th>Kiadás</th><th>Egyenleg</th></tr></thead><tbody>${rows}${diff}</tbody></table>`; };
  const cashBody = `<p class="lead">Hó végi egyenlegek a könyvelés szerint. A pénztár változása az előző hónap végéhez képest${d.penztar_nyito!=null?`, januárban a nyitó egyenleghez (${ft(d.penztar_nyito)}) képest`:""}. Kattints a negyedévre a havi bontásért, majd a hónapra a tételekért.</p>
    ${qTable(["Időszak","Házipénztár","Pénztár változása","Bankszámlák","Összesen"],
      qs.map(q=>{ const e = qEnd(q), s0 = qStart(q); const base = s0>=0 ? P[s0] : d.penztar_nyito; const ch = base==null ? null : (P[e]??0)-base;
        return [q, qLbl(q), `<td>${nf(P[e])}</td><td${neg(ch??0)}>${ch==null?"–":nf(ch)}</td><td${neg(BH[e]??0)}>${nf(BH[e])}</td><td>${nf((P[e]??0)+(BH[e]??0))}</td>`]; }),
      M.map((m,i)=>[qOf(m.m), HU_MF[m.m-1], `<td>${nf(P[i])}</td><td${neg(chg(i)??0)}>${chg(i)==null?"–":nf(chg(i))}</td><td${neg(BH[i]??0)}>${nf(BH[i])}</td><td>${nf((P[i]??0)+(BH[i]??0))}</td>`, CI ? cashItems(CI.months[i]) : null]))}
    ${CI?`<p class="note">A hónapra kattintva látod a pénztár tételeit. Ha a könyvelésben olyan pénztármozgás is van, ami nem pénztárbizonylaton szerepel (például átvezetés vagy kerekítés), azt külön sorban jelezzük.</p>`:""}`;

  // pénz, kintlévőség
  const moneyBody = `<p class="lead">A ${hdS(d.asOf,"i")} könyv szerinti egyenlegek.</p>
    <div class="money">
      <div class="mlist">
        ${d.banks.map(b=>`<div class="mrow"><span>${esc(b.name)}${b.e<0?"<small>hitelkeret igénybe véve</small>":""}</span><span class="num">${ft(b.e)}</span></div>`).join("")}
        <div class="mrow"><span>Házipénztár</span><span class="num">${ft(P[n-1])}</span></div>
        <div class="mrow sum"><span>Összesen</span><span class="num">${ft(cash)}</span></div>
      </div>
      <div class="mlist">
        ${d.vevo!=null?`<div class="mrow"><span>Vevők tartoznak neked${d.vevo_hidden?' <span class="priv" title="Az ügyfél még nem látja">🔒</span>':""}<small>kifizetetlen kimenő számlák</small></span><span class="num">${ft(d.vevo)}</span></div>`:""}
        <div class="mrow"><span>Te tartozol a szállítóknak<small>kifizetetlen bejövő számlák</small></span><span class="num">${ft(d.szallito)}</span></div>
        ${d.vevo!=null?`<div class="mrow sum"><span>Különbözet${d.vevo_hidden?' <span class="priv" title="Az ügyfél még nem látja">🔒</span>':""}</span><span class="num">${ft(d.vevo-d.szallito)}</span></div>`:""}
      </div>
    </div>${openItems(d)}`;

  // ÁFA
  const afaQ = q => AF.filter((a,i)=>a && qOf(i+1)===q);
  const afaBody = `<p class="lead">A kiállított számláid ÁFA-ja (fizetendő) mínusz a beszerzéseid ÁFA-ja (levonható). Ha a különbözet negatív, azt a következő időszakban beszámítjuk. Kattints a negyedévre a havi bontásért.</p>
    ${qTable(["Időszak","Fizetendő ÁFA","Levonható ÁFA","Különbözet"],
      qs.map(q=>{ const L = afaQ(q), f = L.reduce((s,a)=>s+a.fiz,0), l = L.reduce((s,a)=>s+a.lev,0); return [q, qLbl(q), `<td>${nf(f)}</td><td>${nf(l)}</td><td${neg(f-l)}>${nf(f-l)}</td>`]; }),
      AF.map((a,i)=>[qOf(i+1), HU_MF[i], a?`<td>${nf(a.fiz)}</td><td>${nf(a.lev)}</td><td${neg(a.net)}>${nf(a.net)}</td>`:`<td colspan="3">–</td>`]),
      `<td class="lbl">${Y} eddig</td><td>${nf(AF.filter(Boolean).reduce((s,a)=>s+a.fiz,0))}</td><td>${nf(AF.filter(Boolean).reduce((s,a)=>s+a.lev,0))}</td><td${neg(afaY)}>${nf(afaY)}</td>`)}`;

  // hiányzó bizonylatok – a tárgyhavi számlák még nem számítanak hiányzónak
  const MS = d.missing;
  const msRef = MS ? (MS.asOf||"").slice(0,7) : "";
  const isCur = i => i.cur ?? ((i.telj>i.kelte?i.telj:i.kelte)||"").slice(0,7) >= msRef;
  const msLate = MS ? MS.invoices.filter(i=>!isCur(i)) : [], msCur = MS ? MS.invoices.filter(isCur) : [];
  const lateN = MS ? Math.max(0, (MS.invoice_count||0) - msCur.length) : 0;
  const missN = MS ? lateN + (MS.bank_count||0) : 0;
  const invTbl = L => `<div class="tbl"><table><thead><tr><th>Kelte</th><th style="text-align:left">Partner</th><th class="hide-n" style="text-align:left">Számlaszám</th><th>Összeg</th></tr></thead><tbody>${L.map(i=>`<tr><td>${hd(i.kelte)}</td><td class="txt">${esc(i.partner)}<small class="show-n">${esc(i.no)}</small></td><td class="hide-n" style="text-align:left">${esc(i.no)}</td><td>${nf(i.osszeg)}</td></tr>`).join("")}</tbody></table></div>`;
  const curMon = msRef ? HU_MF[+msRef.slice(5,7)-1] : "";
  const missBody = !MS ? "" : `${missN?`<div class="xbar"><button class="xbtn" id="missXlsx" type="button">⬇ Hiányzó bizonylatok letöltése Excelben</button><span class="xmsg" id="missXmsg" role="status"></span></div>`:""}<p class="lead">Ezeket még várjuk tőled: töltsd fel őket az ÜgyfélSegédbe, vagy küldd el nekünk e-mailben az <a href="mailto:anaria@anaria.hu">anaria@anaria.hu</a> címre (állapot: ${hdS(MS.asOf,"i")}).</p>
    <h3>Bankszámlakivonat</h3>
    ${MS.bank_months.length ? `<ul class="miss">${MS.bank_months.map(b=>`<li>${esc(b.account)} ${esc(per(b.month))}</li>`).join("")}</ul>` : `<p class="ok">Minden lezárt hónap bankkivonata megvan.</p>`}
    ${msLate.length ? `<details class="sub" open><summary>Hiányzó számlaképek az előző hónapokból <small>${lateN} db</small></summary>${invTbl(msLate)}</details>` : `<h3>Hiányzó számlaképek az előző hónapokból</h3><p class="ok">Az előző hónapok számlaképei mind megvannak.</p>`}
    ${msCur.length ? `<details class="sub"><summary>E havi számlák <small>${msCur.length} db, még nem késtél velük</small></summary><p class="note">Ezek ${curMon}i számlák – ha már megvannak, nyugodtan töltsd fel őket az ÜgyfélSegédbe, vagy küldd el e-mailben.</p>${invTbl(msCur)}</details>` : ""}`;

  // összevetés az előző évvel
  const PR = d.prev;
  const pct = (a,b) => !b ? "–" : `${a-b>=0?"+":"−"}${Math.abs(Math.round((a-b)/Math.abs(b)*100))}%`;
  const prevBody = !PR ? "" : `<p class="lead">${Y} és ${PR.year} azonos időszaka. Kattints a negyedévre a havi bontásért.</p>
    ${qTable(["Időszak",`Bevétel ${Y}`,`Bevétel ${PR.year}`,"Változás",`Eredmény ${Y}`,`Eredmény ${PR.year}`],
      d.quarters.map(Q=>{ const pm = PR.months.slice(Q.q*3, Q.q*3+3).filter((x,k)=>x && M.some(m=>m.m===Q.q*3+k+1)); const pb = pm.reduce((a,x)=>a+x.bev,0), pe = pm.reduce((a,x)=>a+x.ered,0);
        return [Q.q, qLbl(Q.q), `<td>${nf(Q.bev)}</td><td>${nf(pb)}</td><td>${pct(Q.bev,pb)}</td><td${neg(Q.ered)}>${nf(Q.ered)}</td><td${neg(pe)}>${nf(pe)}</td>`]; }),
      M.map(m=>{ const p = PR.months[m.m-1]; return [qOf(m.m), HU_MF[m.m-1], `<td>${nf(m.bev)}</td><td>${p?nf(p.bev):"–"}</td><td>${p?pct(m.bev,p.bev):"–"}</td><td${neg(m.ered)}>${nf(m.ered)}</td><td${p?neg(p.ered):""}>${p?nf(p.ered):"–"}</td>`]; }),
      `<td class="lbl">Eddig összesen</td><td>${nf(T.bev)}</td><td>${nf(PR.ytd.bev)}</td><td>${pct(T.bev,PR.ytd.bev)}</td><td${neg(T.ered)}>${nf(T.ered)}</td><td${neg(PR.ytd.ered)}>${nf(PR.ytd.ered)}</td>`)}
    ${PR.full && n<12 ? `<p class="note">${PR.year} egész évben: bevétel ${ft(PR.full.bev)}, eredmény ${ft(PR.full.ered)}.</p>` : ""}`;

  // költségszerkezet
  const G = d.groups, gT = G.map((_,k)=>M.reduce((a,m)=>a+m.groups[k],0)), gSum = gT.reduce((a,v)=>a+v,0)||1, gMax = Math.max(...gT,1);
  const costBody = `<p class="lead">Mire ment el a pénz ${yIn(Y)} eddig (költségek és ráfordítások, ${ft(T.kolt)}).</p>
    <div class="hbars">${G.map((g,k)=>`<div class="hb"><span class="hl">${g}</span><span class="ht"><i style="width:${Math.max(0,gT[k])/gMax*100}%"></i></span><span class="hv num">${nf(gT[k])}<small>${Math.round(gT[k]/gSum*100)}%</small></span></div>`).join("")}</div>
    ${qTable(["Időszak", ...G],
      d.quarters.map(Q=>[Q.q, qLbl(Q.q), G.map((_,k)=>`<td>${nf(M.filter(m=>qOf(m.m)===Q.q).reduce((a,m)=>a+m.groups[k],0))}</td>`).join("")]),
      M.map(m=>[qOf(m.m), HU_MF[m.m-1], G.map((_,k)=>`<td>${nf(m.groups[k])}</td>`).join("")]),
      `<td class="lbl">Összesen</td>${gT.map(v=>`<td>${nf(v)}</td>`).join("")}`)}`;

  // hitelek, lízing, tagi kölcsön
  const DB = d.debts || [];
  const dNow = x => x.hist[n-1] ?? 0, dTot = DB.reduce((a,x)=>a+dNow(x),0);
  const DK = {tag:"tagi kölcsön", hitel:"hitel, lízing"};
  const debtBody = !DB.length ? "" : `<p class="lead">Hó végi tartozás a könyvelés szerint. A tagi kölcsön az, amit a tulajdonosok adtak a cégnek, és a cég visszafizethet nekik.</p>
    <div class="mlist">${DB.map(x=>`<div class="mrow"><span>${esc(x.name)}<small>${DK[x.kind]} · év eleje ${nf(x.nyito)} Ft</small></span><span class="num">${ft(dNow(x))}</span></div>`).join("")}<div class="mrow sum"><span>Összesen</span><span class="num">${ft(dTot)}</span></div></div>
    ${qTable(["Időszak", ...DB.map(x=>esc(x.name.length>26?x.name.slice(0,24)+"…":x.name))],
      qs.map(q=>[q, qLbl(q), DB.map(x=>`<td>${nf(x.hist[qEnd(q)])}</td>`).join("")]),
      M.map((m,i)=>[qOf(m.m), HU_MF[m.m-1], DB.map(x=>`<td>${nf(x.hist[i])}</td>`).join("")]))}`;

  // várható társasági adó / KIVA
  const TE = d.tax_est;
  const taxTitle = TE?.kind==="kiva" ? "Várható KIVA" : "Várható társasági adó";
  const taxBody = !TE ? "" : TE.kind==="kiva"
    ? `<p class="lead">Becslés az eddigi könyvelés alapján. A KIVA alapja nagyjából a személyi jellegű kifizetések (bér) és az adózás előtti eredmény összege, a kulcs 10%.</p>
       <div class="mlist"><div class="mrow"><span>Bér és személyi jellegű kifizetés</span><span class="num">${ft(TE.szem)}</span></div><div class="mrow"><span>Adózás előtti eredmény</span><span class="num">${ft(TE.ered)}</span></div><div class="mrow"><span>Becsült KIVA-alap</span><span class="num">${ft(TE.base)}</span></div><div class="mrow sum"><span>Becsült KIVA eddig</span><span class="num">${ft(TE.amount)}</span></div>${TE.n<12?`<div class="mrow"><span>Ha az év így folytatódik<small>éves szintre vetítve</small></span><span class="num">${ft(TE.proj)}</span></div>`:""}</div>`

function supView(S){
  const V = S.kind === "vevo";
  const L = V ? {who:"Vevő", whos:"vevő", lead:`A könyvelésben vezetett vevői folyószámla (vevő analitika) alapján: ki és mennyivel tartozik neked, mi járt le, és hol jött befizetés számla nélkül. A befizetések ${hdS(S.cutoff,"ig")} vannak lekönyvelve; ha azóta fizettek, az itt még nem látszik.`,
      open:"Kifizetetlen vevői számlák", openLead:`Kiállított számláid, amelyekre ${hdS(S.cutoff,"ig")} nem érkezett befizetés. Ahol egy utalás több számlát vagy előleget fedett le, azt a legrégebbi számlákra számoltuk el.`,
      cred:"Túlfizetés, számla nélküli befizetés", credLead:"Ezektől a vevőktől több pénz érkezett, mint amennyi számla le van könyvelve: előleg, túlfizetés vagy olyan befizetés, amihez még nem állítottál ki számlát. Ha tudod, mire jött, szólj.",
      pay:"Átutalással fizető vevők", payH:"átlagosan a számla kiállításától", pnoun:"befizetés", top:"Legnagyobb vevők idén", sumv:"Kiállítva", paid:"Befizetve",
      balLead:"Pozitív: ennyivel tartozik neked a vevő. Negatív: többet fizetett, mint amennyi számla le van könyvelve.", bal:"Egyenleg vevőnként", balN:["tartozás","túlfizetés"],
      src:"Forrás: a könyvelőprogram vevői analitikája (a kiállított számlák és a lekönyvelt befizetések).", search:"Vevő keresése"}
    : {who:"Szállító", whos:"szállító", lead:`A könyvelésben vezetett szállítói folyószámla (szállító analitika) alapján: kinek és mennyivel tartozol, mi járt le, és hol van kifizetés számla nélkül. A kifizetések ${hdS(S.cutoff,"ig")} vannak lekönyvelve; ha azóta fizettél, az itt még nem látszik.`,
      open:"Nyitott szállítói számlák", openLead:`Számlák, amelyekre ${hdS(S.cutoff,"ig")} nincs lekönyvelt kifizetés. Ahol egy utalás több számlát vagy előleget fedett le, azt a legrégebbi számlákra számoltuk el.`,
      cred:"Számla nélküli kifizetések, túlfizetések", credLead:"Ezeknél a szállítóknál több ment ki, mint amennyi számla le van könyvelve. Többnyire hiányzó számla (pl. kártyás vásárlás, külföldi rendelés, biztosítás), előleg vagy dupla fizetés. Ha van hozzá számlád, küldd el nekünk; ha túlfizetés, kérd vissza vagy kérd beszámítani.",
      pay:"Átutalással fizetett számlák", payH:"átlagosan a kiállítástól", pnoun:"kifizetés", top:"Legnagyobb szállítók idén", sumv:"Számlázott", paid:"Kifizetve",
      balLead:"Pozitív: ennyivel tartozol a szállítónak. Negatív: többet fizettél, mint amennyi számla le van könyvelve.", bal:"Egyenleg szállítónként", balN:["tartozás","túlfizetés"],
      src:"Forrás: a könyvelőprogram szállítói analitikája (a könyvelt számlák és kifizetések). Az „Utalások” lap ettől függetlenül a bankkivonatot veti össze a NAV-ból érkezett számlákkal.", search:"Szállító keresése"};
  const pre = V ? "c" : "s";
  const sum = L => L.reduce((s,x)=>s+x.a,0);
  const A = (x, a) => ` data-g="${x.g}" data-n="${esc(x.p)}" data-a="${Math.round(a)}"`;
  const cutS = hdS(S.cutoff,"ig"), cutM = per(S.cutoff.slice(0,7));
  const old = S.open.filter(o=>o.late>30), due = S.open.filter(o=>o.late>0 && o.late<=30), notdue = S.open.filter(o=>!o.late);
  const owe = S.sups.filter(x=>x.bal>0), cred = S.sups.filter(x=>x.bal<0);
  const byP = (L, cols, nc) => {
    const g = {}; L.forEach(o => (g[o.p] ||= []).push(o));
    return Object.entries(g).sort((a,b)=>sum(b[1])-sum(a[1])).map(([p,xs]) =>
      xs.map((o,k)=>`<tr${A(o,o.a)}><td class="txt c">${k?"":esc(p)}</td>${cols(o)}</tr>`).join("") +
      (xs.length>1?`<tr class="tot" data-tot><td></td><td class="lbl" style="text-align:left">${xs.length} tétel</td>${"<td class=\"hide-n\"></td>".repeat(nc-4)}<td>${nf(sum(xs))}</td><td></td></tr>`:"")).join("");
  };
  const lateCell = o => o.late ? `<span class="pill${o.late>30?" warn":""}">${o.late} napja lejárt</span>` : `<span class="pill">nem lejárt</span>`;
  const openCols = o => `<td style="text-align:left">${esc(o.no)}${o.part?' <small>(rész)</small>':""}</td><td class="hide-n">${hd(o.k)}</td><td class="hide-n">${hd(o.e)}</td><td>${nf(o.a)}</td><td>${lateCell(o)}</td>`;
  const openHead = `<thead><tr><th>${L.who}</th><th style="text-align:left">Számlaszám</th><th class="hide-n">Kelte</th><th class="hide-n">Esedékes</th><th>Nyitott</th><th>Állapot</th></tr></thead>`;
  const credCols = o => `<td style="text-align:left"><small>${esc(o.kind==="jóváíró számla"||o.kind==="nyitó egyenleg"?o.kind:L.pnoun+" "+o.kind)}</small><br>${esc(o.no)}</td><td class="hide-n">${hd(o.d)}</td><td class="hide-n"></td><td>${nf(o.a)}</td><td></td>`;
  const top = S.sups.slice().sort((a,b)=>b.inv-a.inv).slice(0,10), mx = top.length ? top[0].inv : 1;
  const totInv = S.sups.reduce((a,x)=>a+Math.max(0,x.inv),0);
  const balRows = S.sups.filter(x=>x.bal).sort((a,b)=>b.bal-a.bal).map(x=>`<tr data-g="${x.g}" data-n="${esc(x.p)}" data-a="${x.bal}"><td class="txt c">${esc(x.p)}</td><td class="hide-n">${nf(x.inv)}</td><td class="hide-n">${nf(x.paid)}</td><td${x.bal<0?' class="neg"':""}>${nf(x.bal)}</td></tr>`).join("");
  const opts = [...new Set([...S.open,...S.later,...S.credit].map(x=>x.g))].map(g=>S.groups[g]).filter(Boolean).sort((a,b)=>a.localeCompare(b,"hu"));
  const ph = (()=>{ const c = {}; S.open.forEach(o=>c[o.p]=(c[o.p]||0)+o.a); const t = Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([p])=>p.split(/[ ,]/)[0]); return t.length ? "pl. "+t.join(", ")+" vagy számlaszám" : L.whos+" neve vagy számlaszám"; })();
  return `
  <p class="lead">${L.lead}</p>

  <div class="pbar" role="search">
    <label for="${pre}q">${L.search}</label>
    <div class="frow"><input id="${pre}q" type="search" list="${pre}list" placeholder="${esc(ph)}" autocomplete="off"><button type="button" hidden>Szűrés törlése</button></div>
    <datalist id="${pre}list">${opts.map(o=>`<option value="${esc(o)}"></option>`).join("")}</datalist>
    <p class="fres" hidden></p>
  </div>

  <section class="tiles" aria-label="${L.who}k összesítve">
    <div class="tile"><span class="k">${L.open}</span><span class="v">${ft(sum(S.open))}</span><span class="h">${S.open.length} számla, ${new Set(S.open.map(o=>o.g)).size} ${L.whos} · ${cutS}</span></div>
    <div class="tile"><span class="k">30 napon túl lejárt</span><span class="v${old.length?" neg":""}">${ft(sum(old))}</span><span class="h">${old.length} számla · + ${due.length} kevésbé régen lejárt (${nf(sum(due))})</span></div>
    <div class="tile"><span class="k">${L.cred}</span><span class="v">${ft(sum(S.credit))}</span><span class="h">${S.credit.length} tétel · ${new Set(S.credit.map(o=>o.g)).size} ${L.whos}nél</span></div>
    <div class="tile"><span class="k">${L.pay}</span><span class="v">${S.pay.avg==null?"–":S.pay.avg<=0?"azonnal":S.pay.avg+" nap"}</span><span class="h">${S.pay.n?`${S.pay.avg<=0?"jellemzően a számla kelte előtt vagy aznap":L.payH} · ${S.pay.on_time}% határidőn belül`:"nincs adat"}</span></div>
  </section>

  <section id="${pre}-open"><h2>${L.open}</h2>
    <p class="lead">${L.openLead}</p>
    <div data-sec="30 napon túl lejárt"><h3>30 napnál régebben lejárt · ${old.length} számla · ${ft(sum(old))}</h3>
    ${old.length?`<div class="tbl"><table>${openHead}<tbody>${byP(old, openCols, 6)}</tbody></table></div>`:'<p class="ok">Nincs ilyen számla.</p>'}</div>
    ${due.length+notdue.length?`<details class="sub" data-sec="lejárt vagy hamarosan esedékes"><summary>Nemrég lejárt vagy még nem esedékes · ${due.length+notdue.length} számla · ${ft(sum(due)+sum(notdue))}</summary>
      <div class="tbl"><table>${openHead}<tbody>${byP(due.concat(notdue), openCols, 6)}</tbody></table></div></details>`:""}
  </section>

  ${S.credit.length?`<details class="sec" id="${pre}-cred" data-sec="számla nélküli ${L.pnoun}"><summary><span class="st">${L.cred}</span><span class="sv num">${S.credit.length} db · ${ft(sum(S.credit))}</span></summary><div class="sb">
    <p class="lead">${L.credLead}</p>
    <div class="tbl"><table><thead><tr><th>${L.who}</th><th style="text-align:left">Tétel</th><th class="hide-n">Dátum</th><th class="hide-n"></th><th>Összeg</th><th></th></tr></thead><tbody>${byP(S.credit, credCols, 6)}</tbody></table></div></div></details>`:""}

  ${S.later.length?`<details class="sec" id="${pre}-later" data-sec="későbbi számla"><summary><span class="st">${cutM} után érkezett számlák</span><span class="sv num">${S.later.length} db · ${ft(sum(S.later))}</span></summary><div class="sb">
    <p class="lead">Ezek ${V?"befizetését":"kifizetését"} a következő havi könyvelés után látjuk.</p>
    <div class="tbl"><table>${openHead}<tbody>${byP(S.later, o=>`<td style="text-align:left">${esc(o.no)}</td><td class="hide-n">${hd(o.k)}</td><td class="hide-n">${hd(o.e)}</td><td>${nf(o.a)}</td><td></td>`, 6)}</tbody></table></div></div></details>`:""}

  <details class="sec" id="${pre}-top" data-sec="a legnagyobbak között"><summary><span class="st">${L.top}</span><span class="sv num">${ft(totInv)} összesen</span></summary><div class="sb">
    <div class="tbl"><table><thead><tr><th>${L.who}</th><th style="text-align:left" class="hide-n">Arány</th><th>${L.sumv}</th></tr></thead><tbody>${top.map(x=>`<tr data-g="${x.g}" data-n="${esc(x.p)}" data-a="${x.inv}"><td class="txt c">${esc(x.p)}<small>${x.n} számla</small></td><td class="hide-n" style="text-align:left;width:40%"><span style="display:inline-block;height:8px;border-radius:4px;background:var(--s1, var(--accent));width:${Math.max(2,Math.round(100*x.inv/mx))}%"></span> <small>${totInv?Math.round(100*x.inv/totInv):0}%</small></td><td>${nf(x.inv)}</td></tr>`).join("")}</tbody></table></div></div></details>

  <details class="sec" id="${pre}-bal" data-sec="egyenleg"><summary><span class="st">${L.bal}</span><span class="sv num">${owe.length} ${L.balN[0]} · ${cred.length} ${L.balN[1]}</span></summary><div class="sb">
    <p class="lead">${L.balLead}</p>
    <div class="tbl"><table><thead><tr><th>${L.who}</th><th class="hide-n">${L.sumv}</th><th class="hide-n">${L.paid}</th><th>Egyenleg</th></tr></thead><tbody>${balRows}</tbody>
    <tfoot><tr><td class="lbl">Összesen</td><td class="hide-n"></td><td class="hide-n"></td><td>${nf(S.total)}</td></tr></tfoot></table></div></div></details>
  <p class="hint">${L.src}</p>`;
}

// Hiányzó bizonylatok → Excel (csak a hiányzók: korábbi hónapok számlaképei + bankkivonat-hónapok)
let XLSXP = null;
function loadXlsx(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return XLSXP || (XLSXP = new Promise((ok, ko) => { const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => ok(window.XLSX); sc.onerror = () => { XLSXP = null; ko(new Error("load")); }; document.head.appendChild(sc); }));
}
async function missXlsx(d, late, msg, btn){
  const say = t => { if (msg) msg.textContent = t; };
  btn.disabled = true; say("Készül…");
  try {
    const X = await loadXlsx(), MS = d.missing;
    const wb = X.utils.book_new();
    const inv = [["Kelte", "Teljesítés", "Partner", "Számlaszám", "Bruttó összeg (Ft)"],
      ...late.map(i => [i.kelte ? new Date(i.kelte + "T00:00:00") : "", i.telj ? new Date(i.telj + "T00:00:00") : "", i.partner || "", i.no || "", i.osszeg ?? ""])];
    const ws = X.utils.aoa_to_sheet(inv, {cellDates: true, dateNF: "yyyy-mm-dd"});
    ws["!cols"] = [{wch: 12}, {wch: 12}, {wch: 42}, {wch: 26}, {wch: 16}];
    for (let r = 1; r < inv.length; r++) { const c = ws[X.utils.encode_cell({r, c: 4})]; if (c && typeof c.v === "number") c.z = "#,##0"; }
    X.utils.book_append_sheet(wb, ws, "Hiányzó számlaképek");
    if (MS.bank_months && MS.bank_months.length) {
      const bk = X.utils.aoa_to_sheet([["Bankszámla", "Hónap"], ...MS.bank_months.map(b => [b.account || "Bankszámla", per(b.month)])]);
      bk["!cols"] = [{wch: 44}, {wch: 18}];
      X.utils.book_append_sheet(wb, bk, "Hiányzó bankkivonatok");
    }
    const buf = X.write(wb, {type: "array", bookType: "xlsx"});
    const fname = `${(d.name || "ceg").replace(/[\\/:*?"<>|]/g, "")} – hiányzó bizonylatok ${MS.asOf || ""}.xlsx`;
    let dl = null; try { dl = window.claude && await Promise.race([claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 3000))]); } catch (e) {}
    if (dl) {
      try { await dl.save({filename: fname, data: new Blob([buf])}); say("Letöltve."); }
      catch (e) { say(e && e.code === "declined" ? "" : "Nem sikerült a letöltés, próbáld újra később."); }
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([buf], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
      a.download = fname; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); say("");
    }
  } catch (e) { console.error(e); say("Nem sikerült elkészíteni az Excelt, próbáld újra később."); }
  finally { btn.disabled = false; }
}

function wirePay(root, U, vid = "v-pay", key = "pq"){
  const view = root.querySelector("#" + vid); if (!view) return;
  const GROUPS = {}; U.groups.forEach((g,i) => { if (g) GROUPS[g] = i; });
  const fold = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
  const q = view.querySelector(".pbar input[type=search]"), clr = view.querySelector(".pbar button"), res = view.querySelector(".pbar .fres");
  const items = [...view.querySelectorAll("[data-g][data-n]")];
  const tots = [...view.querySelectorAll("[data-tot]")];
  const secs = [...view.querySelectorAll("[data-sec]")];
  const boxes = sec => [...sec.querySelectorAll(".tbl, .dups")].filter(t => t.closest("[data-sec]") === sec);
  const openState = new Map(secs.filter(s=>s.tagName==="DETAILS").map(s=>[s,s.open]));
  function apply(){
    const raw = q.value.trim(), on = raw.length > 0;
    clr.hidden = !on;
    const g = Object.prototype.hasOwnProperty.call(GROUPS, raw) ? String(GROUPS[raw]) : null;
    const f = fold(raw);
    items.forEach(el => {
      const hit = !on || (g !== null ? el.dataset.g === g : (fold(el.dataset.n).includes(f) || fold(el.textContent).includes(f)));
      el.hidden = !hit;
      const c = el.querySelector("td.c");
      if (c) {
        if (on && hit && !c.textContent.trim()) { c.textContent = el.dataset.n; c.dataset.filled = "1"; }
        else if (!on && c.dataset.filled) { c.textContent = ""; delete c.dataset.filled; }
      }
    });
    tots.forEach(t => t.hidden = on);
    const parts = [];
    secs.forEach(sec => {
      const own = [...sec.querySelectorAll("[data-g][data-n]")].filter(el => el.closest("[data-sec]") === sec);
      const vis = own.filter(el => !el.hidden);
      let note = sec.querySelector(".empty-note");
      const empty = on && own.length && !vis.length;
      if (empty && !note) { note = document.createElement("p"); note.className = "empty-note"; note.textContent = "Ennél a szállítónál nincs ilyen tétel."; const b = boxes(sec)[0]; if (b) b.before(note); }
      if (note) note.hidden = !empty;
      boxes(sec).forEach(b => b.hidden = !!empty);
      if (sec.tagName === "DETAILS") sec.open = on ? vis.length > 0 : openState.get(sec);
      if (on && vis.length) parts.push(`<b>${vis.length}</b> ${sec.dataset.sec} (${ft(vis.reduce((a,el)=>a+Number(el.dataset.a||0),0))})`);
    });
    view.querySelectorAll("details.sec:not([data-sec])").forEach(d => {
      if (!openState.has(d)) openState.set(d, d.open);
      d.open = on ? [...d.querySelectorAll("[data-g][data-n]")].some(el => !el.hidden) : openState.get(d);
    });
    res.hidden = !on;
    res.innerHTML = on ? (parts.length ? parts.join(" · ") : "Nincs találat. Próbáld a név egy részével, pl. csak „Gledicia”.") : "";
    try { on ? sessionStorage.setItem(key, raw) : sessionStorage.removeItem(key); } catch(e) {}
  }
  q.addEventListener("input", apply);
  clr.addEventListener("click", () => { q.value = ""; apply(); q.focus(); });
  view.querySelectorAll("td.c").forEach(td => {
    td.title = "Szűrés erre a szállítóra";
    td.addEventListener("click", () => { const tr = td.closest("[data-g]"); if (!tr) return;
      q.value = U.groups[+tr.dataset.g] || tr.dataset.n; apply(); q.scrollIntoView({block:"nearest"}); });
  });
  try { const v = sessionStorage.getItem(key); if (v) { q.value = v; apply(); } } catch(e) {}
}

function openItems(d){
  const O = d.open_items;
  if (!O) return "";
  const tbl = (list, who) => `<div class="tbl"><table><thead><tr><th>Számla</th><th class="hide-n">Teljesítés</th><th>Fiz. határidő</th><th style="text-align:left">${who}</th><th>Összeg</th></tr></thead>
    <tbody>${list.map(u=>`<tr><td>${esc(u.no)}</td><td class="hide-n">${hd(u.telj)}</td><td>${hd(u.hatarido)}</td><td class="lbl" style="white-space:normal;text-align:left">${esc(u.partner)}</td><td>${nf(u.osszeg)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td class="lbl">Összesen</td><td class="hide-n"></td><td></td><td></td><td>${nf(list.reduce((a,u)=>a+u.osszeg,0))}</td></tr></tfoot></table></div>`;
  return `<details class="more"><summary>Kifizetetlen számlák tételesen</summary>
    ${O.vevo?.length?`<h3>Vevőid tartozásai · ${O.vevo.length} db${d.vevo_hidden?' <span class="priv" title="Az ügyfél még nem látja">🔒</span>':""}</h3>${tbl(O.vevo,"Vevő")}`:""}
    ${O.szallito?.length?`<h3 style="margin-top:18px">Tartozásaid a szállítók felé · ${O.szallito.length} db</h3>${tbl(O.szallito,"Szállító")}`:""}
  </details>`;
}

function detailTable(d){
  const M = d.months, qs = d.quarters;
  const qv = (k, q) => M.filter(m=>Math.floor((m.m-1)/3)===q).reduce((a,m)=>a+m[k],0);
  const row = (lbl, k, cls="") => `<tr class="${cls}"><td class="lbl">${lbl}</td>${qs.map(Q=>`<td class="hide-n">${nf(qv(k,Q.q))}</td>`).join("")}<td>${nf(M.reduce((a,m)=>a+m[k],0))}</td></tr>`;
  const L = Object.fromEntries(d.lines);
  const costKeys = d.lines.slice(2).map(x=>x[0]).filter(k => M.some(m=>m[k]));
  return `<div class="tbl"><table>
    <thead><tr><th>Sor</th>${qs.map(Q=>`<th class="hide-n">${QN[Q.q]} n.év</th>`).join("")}<th>Összesen</th></tr></thead>
    <tbody>
      ${row("Bevételek összesen","bev","grp")}
      ${row(L.arbev,"arbev","sub2")}${M.some(m=>m.egybev)?row(L.egybev,"egybev","sub2"):""}
      ${row("Költségek, ráfordítások","kolt","grp")}
      ${costKeys.map(k=>row(L[k],k,"sub2")).join("")}
    </tbody>
    <tfoot><tr><td class="lbl">Eredmény adózás előtt</td>${qs.map(Q=>{const v=qv("ered",Q.q);return `<td class="hide-n${v<0?" neg":""}">${nf(v)}</td>`;}).join("")}<td${neg(d.ytd.ered)}>${nf(d.ytd.ered)}</td></tr></tfoot>
  </table></div>`;
}

function wireCopy(root){
  root.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    const t = b.dataset.copy, old = b.textContent;
    try { await navigator.clipboard.writeText(t); b.textContent = "Másolva"; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "Kijelölve"; }
    setTimeout(() => b.textContent = old, 1500);
  }));
}

function drawChart(d){
  const el = document.getElementById("chart"); if (!el) return;
  const ms = d.months;
  const W = Math.max(320, Math.min(900, el.clientWidth || 760)), narrow = W < 560;
  const H = narrow ? 220 : 260, L = narrow ? 40 : 56, R = 6, T = 14, B = 28;
  const max = Math.max(...ms.flatMap(m=>[m.bev, m.kolt]), 1);
  const step = [100000,200000,250000,500000,1e6,2e6,2.5e6,5e6,1e7,2e7,5e7,1e8].find(s=>max/s<=5) || 2e8;
  const top = Math.ceil(max/step)*step;
  const y = v => T + (H-T-B)*(1-Math.max(0,v)/top);
  const bw = (W-L-R)/ms.length, w = Math.max(3, Math.min(18, (bw-8)/2));
  const fmt = v => v===0 ? "0" : v>=1e6 ? (v/1e6).toLocaleString("hu-HU")+" M" : (v/1e3).toLocaleString("hu-HU")+" e";
  const bar = (x, v, col) => { const h = Math.max(0, y(0)-y(v)); if (h<=0) return ""; const r = Math.min(4, h/2, w/2), y0 = y(v);
    return `<path d="M${x},${y(0)} V${y0+r} Q${x},${y0} ${x+r},${y0} H${x+w-r} Q${x+w},${y0} ${x+w},${y0+r} V${y(0)} Z" fill="${col}"/>`; };
  let g = "";
  for(let v=0; v<=top+1; v+=step){
    g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-num)">${fmt(v)}</text>`;
  }
  ms.forEach((m,k)=>{
    const cx = L + bw*k + bw/2;
    g += `<g class="b" data-k="${k}" tabindex="0"><rect x="${L+bw*k}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>${bar(cx-w-1, m.bev, "var(--s1)")}${bar(cx+1, m.kolt, "var(--s2)")}<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="${narrow?10:11.5}" fill="var(--ink-2)">${narrow?m.m:HU_M[m.m-1]}</text></g>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Havi bevétel és ráfordítás oszlopdiagram">${g}</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.querySelectorAll("g.b").forEach(b=>{
    const k = +b.dataset.k, m = ms[k];
    const show = ()=>{ const s = svg.getBoundingClientRect().width/W;
      tip.innerHTML = `<b>${HU_MF[m.m-1]}</b><br>Bevétel <span class="num">${ft(m.bev)}</span><br>Ráfordítás <span class="num">${ft(m.kolt)}</span><br>Eredmény <span class="num">${ft(m.ered)}</span>`;
      const x = Math.min(Math.max((L+bw*k+bw/2)*s, 90), svg.getBoundingClientRect().width-90);
      tip.style.left = x+"px"; tip.style.top = y(Math.max(m.bev,m.kolt))*s+"px"; tip.hidden = false; };
    b.addEventListener("mouseenter", show); b.addEventListener("focus", show); b.addEventListener("click", show);
    b.addEventListener("mouseleave", ()=>tip.hidden = true); b.addEventListener("blur", ()=>tip.hidden = true);
  });
}

// széles táblázatoknál a vízszintes csúszka a táblázat tetején is megjelenik, a kettő együtt mozog
function topScrollbars(root){
  root.querySelectorAll(".tbl").forEach(t => {
    if (t.previousElementSibling?.classList.contains("tscroll")) return;
    const top = document.createElement("div"); top.className = "tscroll"; top.hidden = true;
    const inner = document.createElement("div"); top.appendChild(inner);
    t.parentNode.insertBefore(top, t);
    let lock = false;
    top.addEventListener("scroll", () => { if (lock) { lock = false; return; } lock = true; t.scrollLeft = top.scrollLeft; });
    t.addEventListener("scroll", () => { if (lock) { lock = false; return; } lock = true; top.scrollLeft = t.scrollLeft; });
    const fit = () => { const w = t.scrollWidth, c = t.clientWidth; top.hidden = !c || w <= c + 1; inner.style.width = w + "px"; top.scrollLeft = t.scrollLeft; };
    try { new ResizeObserver(fit).observe(t); const tb = t.querySelector("table"); if (tb) new ResizeObserver(fit).observe(tb); } catch (e) { window.addEventListener("resize", fit); }
    fit();
  });
}
