const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Megnyitás…"; err.textContent = "";
  let data;
  try { data = await decrypt(document.getElementById("pw").value.replace(/\D/g,"")); }
  catch(x){ err.textContent = "Hibás jelszó. Ellenőrizd, és próbáld újra."; btn.disabled = false; btn.textContent = "Megnyitás"; return; }
  render(data);
});

const nf = n => { if (n==null) return "–"; const v = Math.round(n), s = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g," "); return (v<0?"−":"") + s; };
const ft = n => nf(n) + " Ft";
const HU_M = ["jan.","febr.","márc.","ápr.","máj.","jún.","júl.","aug.","szept.","okt.","nov.","dec."];
const HU_MF = ["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
const hd = s => s ? s.replace(/-/g,". ")+"." : "–";
const hdLong = s => { if(!s) return "–"; const [y,m,d] = s.split("-"); return `${y}. ${HU_MF[+m-1]} ${+d}.`; };
const per = p => { const m = /^(\d{4})-(\d{2})$/.exec(p||""); return m ? `${m[1]}. ${HU_MF[+m[2]-1]}` : (p||"").replace(/(\d)\. n\.év/,"$1. negyedév"); };
const QN = ["I.","II.","III.","IV."];
const hdS = (s, suf) => { if(!s) return "–"; const [y,m,d] = s.split("-"); return `${y}. ${HU_MF[+m-1]} ${+d}-${suf}`; };
const yIn = y => y + "-" + ("368".includes(String(y).slice(-1)) || String(y).endsWith("0") ? "ban" : "ben");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const neg = v => v < 0 ? ' class="neg"' : "";

function renderPay(d){
  const app = document.getElementById("app");
  app.innerHTML = `
  <header>
    <div class="firm">Anaria Balance Kft. · utalások áttekintése</div>
    <h1>${esc(d.name)}</h1>
    <p class="sub">Feldolgozott bankkivonatok: ${hdS(d.utal.end,"ig")}</p>
  </header>
  <div id="v-pay" class="view">${payView(d.utal)}</div>
  <footer class="foot">
    <p>Ez tájékoztató összevetés a feltöltött bankkivonataid és a NAV Online Számla rendszeréből érkezett bejövő számláid alapján, nem könyvelési kimutatás. Ha valamit másképp rendeztél (készpénz, kártya, beszámítás), szólj, és javítjuk. Kérdésed van? Írj nekünk: <span class="num">anaria@anaria.hu</span></p>

}

function render(d){

  const Y = d.year, M = d.months, T = d.ytd, n = M.length;
  const memo8 = (d.adoszam||"").replace(/\D/g,"").slice(0,8);

  </section>` : `<section class="next"><span class="lbl">Következő befizetés</span><span class="date">${lagging ? "Hamarosan jelezzük" : "Nincs nyitott befizetés"}</span><span></span><p class="det">${lagging ? `A könyvelés ${hdS(d.asOf,"ig")} van lezárva, az azóta esedékes adókat és járulékokat a bevallások után külön megküldjük. A várható határidőket lent látod.` : "A lezárt könyvelés alapján jelenleg nincs esedékes adó vagy járulék."}</p></section>`;

  const acct = n => n ? `<span class="acct"><code>${n}</code><button class="cp" data-copy="${n}">Másol</button></span>` : "<span></span>";
  const up = d.upcoming || [];
  const cash = (d.bank||0) + (d.penztar[n-1]||0);
  const AF = (d.afa||[]);
  const afaY = AF.filter(Boolean).reduce((a,x)=>a+x.net,0);
  const sec = (id, title, val, body, cls="") => `<details class="sec" id="${id}"><summary><span class="st">${title}</span><span class="sv num${cls}">${val}</span></summary><div class="sb">${body}</div></details>`;
  // negyedéves táblázat, kattintásra havi sorokkal
  let qid = 0;
  const qTable = (heads, qRows, mRows, foot) => { const g = "g" + (qid++), nc = heads.length;
    return `<div class="tbl"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${qRows.map(([q, label, cells])=>`<tr><td class="lbl"><button class="qx" aria-expanded="false" data-g="${g}" data-q="${q}">${label}</button></td>${cells}</tr>${mRows.filter(r=>r[0]===q).map(([,ml,mc,sub],k)=>`<tr class="mr" data-g="${g}" data-q="${q}" hidden><td class="lbl">${sub?`<button class="qx mx" aria-expanded="false" data-g="${g}" data-k="${q}-${k}">${ml}</button>`:ml}</td>${mc}</tr>${sub?`<tr class="it" data-g="${g}" data-q="${q}" data-k="${q}-${k}" hidden><td colspan="${nc}">${sub}</td></tr>`:""}`).join("")}`).join("")}</tbody>
      ${foot?`<tfoot><tr>${foot}</tr></tfoot>`:""}</table></div>`; };
  const qOf = m => Math.floor((m-1)/3);
  const qs = [...new Set(M.map(m=>qOf(m.m)))];

  </footer>`;

function phPay(u){const c={};for(const x of [...u.open,...u.paid]){const n=(u.groups&&u.groups[x.g])||x.p;c[n]=(c[n]||0)+1;}const t=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([p])=>p.split(/[ ,]/)[0]);return t.length?"pl. "+t.join(", ")+" vagy számlaszám":"szállító neve vagy számlaszám";}

  const endS = hdS(U.end,"ig"), startS = per(U.start), endM = per(U.end.slice(0,7));
  const byPartner = (L, cols) => {
    const g = {}; L.forEach(o => (g[o.p] ||= []).push(o));
    return Object.entries(g).sort((a,b)=>sum(b[1])-sum(a[1])).map(([p,xs]) =>
      xs.map((o,k)=>`<tr${A(o,o.a)}><td class="txt c">${k?"":esc(p)}</td>${cols(o)}</tr>`).join("") +
      (xs.length>1?`<tr class="tot" data-tot><td></td><td class="lbl" style="text-align:left">${xs.length} számla</td><td class="hide-n"></td><td class="hide-n"></td><td>${nf(sum(xs))}</td><td></td></tr>`:"")).join("");
  };
  const ageCols = o => `<td style="text-align:left">${esc(o.no)}</td><td class="hide-n">${hd(o.k)}</td><td class="hide-n">${hd(o.t)}</td><td>${nf(o.a)}</td><td><span class="pill${o.age>60?" warn":""}">${o.age} napja</span></td>`;
  const openHead = `<thead><tr><th>Szállító</th><th style="text-align:left">Számlaszám</th><th class="hide-n">Kelte</th><th class="hide-n">Teljesítés</th><th>Bruttó</th><th>Nyitva</th></tr></thead>`;
  const dupCards = U.dup.map(x => `<article class="dup"${A(x, x.a*(x.d.length-1))}>
    <header><div><div class="pn">${esc(x.p)}</div><div class="no">${esc(x.no)}</div></div><div class="amt">${ft(x.a)}<small>${x.d.length}× utalva</small></div></header>
    <ul>${x.d.map(d=>`<li>${hd(d)} · ${nf(x.a)}</li>`).join("")}</ul>
    ${x.nf?`<p>Ehhez a hivatkozáshoz nem jött számla a NAV-ból (pl. 2025-ös számla vagy díjbekérő), a közlemény és az összeg egyezése alapján jelöltük.</p>`:""}
    ${x.off?`<p class="hint2">Lehet, hogy a szállító beszámította: a(z) <b>${esc(x.off.no)}</b> (${hd(x.off.d)}, ${ft(x.off.a)}) ugyanekkora számlára nem utaltál. Ha a szállítónál ez rendezettnek látszik, nincs teendőd.</p>`
            :`<p class="hint2">Nem látunk későbbi számlát, amibe beszámíthatták volna, és visszautalás sem jött. Kérj egyenlegközlőt a szállítótól, vagy kérd vissza a túlfizetést.</p>`}
  </article>`).join("");
  const sure = U.paid.filter(m=>m.s).length;
  const paidRows = U.paid.map(m => `<tr${m.s?"":' class="soft"'}${A(m,m.a)}><td>${hd(m.d)}</td><td class="txt c">${esc(m.p)}</td><td class="txt">${m.inv.slice(0,6).map(esc).join("<br>")}${m.inv.length>6?`<br><small>+${m.inv.length-6} további</small>`:""}</td><td>${nf(m.a)}</td><td class="txt">${m.h?`<small>${m.h}${m.ia!=null?`, számla ${nf(m.ia)}`:""}</small>`:""}</td></tr>`).join("");
  const twinRows = U.twins.map(t => `<tr${A(t,t.a)}><td class="txt c">${esc(t.p)}</td><td style="text-align:left">${esc(t.no)}</td><td class="hide-n">${hd(t.k)}</td><td>${nf(t.a)}</td><td style="text-align:left">${esc(t.tw)}</td><td>${hd(t.twd)}</td></tr>`).join("");
  const noRows = U.noinv.map(u => `<tr${A(u,u.a)}><td>${hd(u.d)}</td><td class="txt c">${esc(u.p)}</td><td class="txt"><small>${esc(u.m)}</small></td><td>${nf(u.a)}</td></tr>`).join("");
  const backRows = U.back.map(u => `<tr${A(u,u.a)}><td>${hd(u.d)}</td><td class="txt c">${esc(u.p)}</td><td class="txt"><small>${esc(u.m)}</small></td><td>${nf(u.a)}</td></tr>`).join("");

  return `

  <div class="pbar" role="search">
    <label for="pq">Szállító keresése</label>
    <div class="frow"><input id="pq" type="search" list="plist" placeholder="${esc(phPay(U))}" autocomplete="off"><button id="pclear" type="button" hidden>Szűrés törlése</button></div>
    <datalist id="plist">${opts.map(o=>`<option value="${esc(o)}"></option>`).join("")}</datalist>

  </div>

  <section class="tiles" aria-label="Utalások összesítve">

    ${U.open.length||PRIV?`<div class="tile"><span class="k">Utalandó, 30 napnál régebbi${LK}</span><span class="v${old.length?" neg":""}">${ft(sum(old))}</span><span class="h">${old.length} számla · + ${fresh.length} friss (${nf(sum(fresh))})</span></div>`:""}
    ${U.later.length?`<div class="tile"><span class="k">${endM} utáni számlák</span><span class="v">${ft(sum(U.later))}</span><span class="h">${U.later.length} számla, a kivonat még nincs fent</span></div>`:""}
  </section>

  <div class="secs">
  ${U.dup.length?`<details class="sec" id="p-dup" data-sec="duplán utalt"><summary><span class="st">Duplán utalt számlák${U.dup_hidden?' <span class="priv" title="Az ügyfél még nem látja">🔒</span>':""}</span><span class="sv num neg">${U.dup.length} db · túlfizetés ${ft(over)}</span></summary><div class="sb">
    ${U.dup_hidden?`<p class="privnote">🔒 Csak neked látszik – az ügyfél oldalán ez a rész még nincs kint.</p>`:""}<p class="lead">Ugyanarra a számlára, ugyanazzal a közleménnyel és összeggel többször ment ki utalás.</p>
    <div class="dups">${dupCards}</div></div></details>`:""}
  ${U.open.length?`<details class="sec" id="p-open"><summary><span class="st">Utalandó számlák${LK}</span><span class="sv num${old.length?" neg":""}">${old.length+fresh.length} számla · ${ft(sum(old)+sum(fresh))}</span></summary><div class="sb">
    <p class="lead">Átutalásos számlák ${endS}, amelyekre nem találtunk utalást a kivonatokban. Ha valamelyiket csoportos beszedéssel, kártyával vagy beszámítással rendezted, szólj, és kivesszük.</p>
    <div data-sec="utalandó, 30 napon túli"><h3>30 napnál régebbi teljesítés · ${old.length} számla · ${ft(sum(old))}</h3>
    ${old.length?`<div class="tbl"><table>${openHead}<tbody>${byPartner(old, ageCols)}</tbody></table></div>`:'<p class="ok">Nincs ilyen számla.</p>'}</div>
    ${fresh.length?`<details class="sub" data-sec="utalandó, friss"><summary>Friss számlák, valószínűleg még nem jártak le <small>${fresh.length} db · ${nf(sum(fresh))} Ft</small></summary>

  </div></details>`:""}

function supView(S){
  const V = S.kind === "vevo";
  const L = V ? {who:"Vevő", whos:"vevő", lead:`A könyvelésben vezetett vevői folyószámla (vevő analitika) alapján: ki és mennyivel tartozik neked, mi járt le, és hol jött befizetés számla nélkül. A befizetések ${hdS(S.cutoff,"ig")} vannak lekönyvelve; ha azóta fizettek, az itt még nem látszik.`,

      cred:"Túlfizetés, számla nélküli befizetés", credLead:"Ezektől a vevőktől több pénz érkezett, mint amennyi számla le van könyvelve: előleg, túlfizetés vagy olyan befizetés, amihez még nem állítottál ki számlát. Ha tudod, mire jött, szólj.",

  const top = S.sups.slice().sort((a,b)=>b.inv-a.inv).slice(0,10), mx = top.length ? top[0].inv : 1;
  const totInv = S.sups.reduce((a,x)=>a+Math.max(0,x.inv),0);
  const balRows = S.sups.filter(x=>x.bal).sort((a,b)=>b.bal-a.bal).map(x=>`<tr data-g="${x.g}" data-n="${esc(x.p)}" data-a="${x.bal}"><td class="txt c">${esc(x.p)}</td><td class="hide-n">${nf(x.inv)}</td><td class="hide-n">${nf(x.paid)}</td><td${x.bal<0?' class="neg"':""}>${nf(x.bal)}</td></tr>`).join("");
  const opts = [...new Set([...S.open,...S.later,...S.credit].map(x=>x.g))].map(g=>S.groups[g]).filter(Boolean).sort((a,b)=>a.localeCompare(b,"hu"));
  const ph = (()=>{ const c = {}; S.open.forEach(o=>c[o.p]=(c[o.p]||0)+o.a); const t = Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([p])=>p.split(/[ ,]/)[0]); return t.length ? "pl. "+t.join(", ")+" vagy számlaszám" : L.whos+" neve vagy számlaszám"; })();
  return `

    <div class="frow"><input id="${pre}q" type="search" list="${pre}list" placeholder="${esc(ph)}" autocomplete="off"><button type="button" hidden>Szűrés törlése</button></div>
    <datalist id="${pre}list">${opts.map(o=>`<option value="${esc(o)}"></option>`).join("")}</datalist>
    <p class="fres" hidden></p>
  </div>

  <section class="tiles" aria-label="${L.who}k összesítve">
    <div class="tile"><span class="k">${L.open}</span><span class="v">${ft(sum(S.open))}</span><span class="h">${S.open.length} számla, ${new Set(S.open.map(o=>o.g)).size} ${L.whos} · ${cutS}</span></div>
    <div class="tile"><span class="k">30 napon túl lejárt</span><span class="v${old.length?" neg":""}">${ft(sum(old))}</span><span class="h">${old.length} számla · + ${due.length} kevésbé régen lejárt (${nf(sum(due))})</span></div>
    <div class="tile"><span class="k">${L.cred}</span><span class="v">${ft(sum(S.credit))}</span><span class="h">${S.credit.length} tétel · ${new Set(S.credit.map(o=>o.g)).size} ${L.whos}nél</span></div>
    <div class="tile"><span class="k">${L.pay}</span><span class="v">${S.pay.avg==null?"–":S.pay.avg<=0?"azonnal":S.pay.avg+" nap"}</span><span class="h">${S.pay.n?`${S.pay.avg<=0?"jellemzően a számla kelte előtt vagy aznap":L.payH} · ${S.pay.on_time}% határidőn belül`:"nincs adat"}</span></div>
  </section>

    <p class="lead">${L.openLead}</p>
    <div data-sec="30 napon túl lejárt"><h3>30 napnál régebben lejárt · ${old.length} számla · ${ft(sum(old))}</h3>
    ${old.length?`<div class="tbl"><table>${openHead}<tbody>${byP(old, openCols, 6)}</tbody></table></div>`:'<p class="ok">Nincs ilyen számla.</p>'}</div>
    ${due.length+notdue.length?`<details class="sub" data-sec="lejárt vagy hamarosan esedékes"><summary>Nemrég lejárt vagy még nem esedékes · ${due.length+notdue.length} számla · ${ft(sum(due)+sum(notdue))}</summary>

  </section>

  ${S.credit.length?`<details class="sec" id="${pre}-cred" data-sec="számla nélküli ${L.pnoun}"><summary><span class="st">${L.cred}</span><span class="sv num">${S.credit.length} db · ${ft(sum(S.credit))}</span></summary><div class="sb">
    <p class="lead">${L.credLead}</p>
    <div class="tbl"><table><thead><tr><th>${L.who}</th><th style="text-align:left">Tétel</th><th class="hide-n">Dátum</th><th class="hide-n"></th><th>Összeg</th><th></th></tr></thead><tbody>${byP(S.credit, credCols, 6)}</tbody></table></div></div></details>`:""}

  ${S.later.length?`<details class="sec" id="${pre}-later" data-sec="későbbi számla"><summary><span class="st">${cutM} után érkezett számlák</span><span class="sv num">${S.later.length} db · ${ft(sum(S.later))}</span></summary><div class="sb">
    <p class="lead">Ezek ${V?"befizetését":"kifizetését"} a következő havi könyvelés után látjuk.</p>
    <div class="tbl"><table>${openHead}<tbody>${byP(S.later, o=>`<td style="text-align:left">${esc(o.no)}</td><td class="hide-n">${hd(o.k)}</td><td class="hide-n">${hd(o.e)}</td><td>${nf(o.a)}</td><td></td>`, 6)}</tbody></table></div></div></details>`:""}

  <details class="sec" id="${pre}-top" data-sec="a legnagyobbak között"><summary><span class="st">${L.top}</span><span class="sv num">${ft(totInv)} összesen</span></summary><div class="sb">
    <div class="tbl"><table><thead><tr><th>${L.who}</th><th style="text-align:left" class="hide-n">Arány</th><th>${L.sumv}</th></tr></thead><tbody>${top.map(x=>`<tr data-g="${x.g}" data-n="${esc(x.p)}" data-a="${x.inv}"><td class="txt c">${esc(x.p)}<small>${x.n} számla</small></td><td class="hide-n" style="text-align:left;width:40%"><span style="display:inline-block;height:8px;border-radius:4px;background:var(--s1, var(--accent));width:${Math.max(2,Math.round(100*x.inv/mx))}%"></span> <small>${totInv?Math.round(100*x.inv/totInv):0}%</small></td><td>${nf(x.inv)}</td></tr>`).join("")}</tbody></table></div></div></details>

  <details class="sec" id="${pre}-bal" data-sec="egyenleg"><summary><span class="st">${L.bal}</span><span class="sv num">${owe.length} ${L.balN[0]} · ${cred.length} ${L.balN[1]}</span></summary><div class="sb">
    <p class="lead">${L.balLead}</p>
    <div class="tbl"><table><thead><tr><th>${L.who}</th><th class="hide-n">${L.sumv}</th><th class="hide-n">${L.paid}</th><th>Egyenleg</th></tr></thead><tbody>${balRows}</tbody>
    <tfoot><tr><td class="lbl">Összesen</td><td class="hide-n"></td><td class="hide-n"></td><td>${nf(S.total)}</td></tr></tfoot></table></div></div></details>
  <p class="hint">${L.src}</p>`;
}

// Hiányzó bizonylatok → Excel (csak a hiányzók: korábbi hónapok számlaképei + bankkivonat-hónapok)
let XLSXP = null;
function loadXlsx(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return XLSXP || (XLSXP = new Promise((ok, ko) => { const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => ok(window.XLSX); sc.onerror = () => { XLSXP = null; ko(new Error("load")); }; document.head.appendChild(sc); }));
}
async function missXlsx(d, late, msg, btn){
  const say = t => { if (msg) msg.textContent = t; };
  btn.disabled = true; say("Készül…");
  try {
    const X = await loadXlsx(), MS = d.missing;
    const wb = X.utils.book_new();
    const inv = [["Kelte", "Teljesítés", "Partner", "Számlaszám", "Bruttó összeg (Ft)"],
      ...late.map(i => [i.kelte ? new Date(i.kelte + "T00:00:00") : "", i.telj ? new Date(i.telj + "T00:00:00") : "", i.partner || "", i.no || "", i.osszeg ?? ""])];
    const ws = X.utils.aoa_to_sheet(inv, {cellDates: true, dateNF: "yyyy-mm-dd"});
    ws["!cols"] = [{wch: 12}, {wch: 12}, {wch: 42}, {wch: 26}, {wch: 16}];
    for (let r = 1; r < inv.length; r++) { const c = ws[X.utils.encode_cell({r, c: 4})]; if (c && typeof c.v === "number") c.z = "#,##0"; }
    X.utils.book_append_sheet(wb, ws, "Hiányzó számlaképek");
    if (MS.bank_months && MS.bank_months.length) {
      const bk = X.utils.aoa_to_sheet([["Bankszámla", "Hónap"], ...MS.bank_months.map(b => [b.account || "Bankszámla", per(b.month)])]);
      bk["!cols"] = [{wch: 44}, {wch: 18}];
      X.utils.book_append_sheet(wb, bk, "Hiányzó bankkivonatok");
    }
    const buf = X.write(wb, {type: "array", bookType: "xlsx"});
    const fname = `${(d.name || "ceg").replace(/[\\/:*?"<>|]/g, "")} – hiányzó bizonylatok ${MS.asOf || ""}.xlsx`;
    let dl = null; try { dl = window.claude && await Promise.race([claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 3000))]); } catch (e) {}
    if (dl) {
      try { await dl.save({filename: fname, data: new Blob([buf])}); say("Letöltve."); }
      catch (e) { say(e && e.code === "declined" ? "" : "Nem sikerült a letöltés, próbáld újra később."); }
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([buf], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
      a.download = fname; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); say("");
    }
  } catch (e) { console.error(e); say("Nem sikerült elkészíteni az Excelt, próbáld újra később."); }
  finally { btn.disabled = false; }
}

function wirePay(root, U, vid = "v-pay", key = "pq"){
  const view = root.querySelector("#" + vid); if (!view) return;
  const GROUPS = {}; U.groups.forEach((g,i) => { if (g) GROUPS[g] = i; });
  const fold = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
  const q = view.querySelector(".pbar input[type=search]"), clr = view.querySelector(".pbar button"), res = view.querySelector(".pbar .fres");
  const items = [...view.querySelectorAll("[data-g][data-n]")];
  const tots = [...view.querySelectorAll("[data-tot]")];
  const secs = [...view.querySelectorAll("[data-sec]")];
  const boxes = sec => [...sec.querySelectorAll(".tbl, .dups")].filter(t => t.closest("[data-sec]") === sec);
  const openState = new Map(secs.filter(s=>s.tagName==="DETAILS").map(s=>[s,s.open]));
  function apply(){
    const raw = q.value.trim(), on = raw.length > 0;
    clr.hidden = !on;
    const g = Object.prototype.hasOwnProperty.call(GROUPS, raw) ? String(GROUPS[raw]) : null;
    const f = fold(raw);
    items.forEach(el => {
      const hit = !on || (g !== null ? el.dataset.g === g : (fold(el.dataset.n).includes(f) || fold(el.textContent).includes(f)));
      el.hidden = !hit;
      const c = el.querySelector("td.c");
      if (c) {
        if (on && hit && !c.textContent.trim()) { c.textContent = el.dataset.n; c.dataset.filled = "1"; }
        else if (!on && c.dataset.filled) { c.textContent = ""; delete c.dataset.filled; }
      }
    });
    tots.forEach(t => t.hidden = on);
    const parts = [];
    secs.forEach(sec => {
      const own = [...sec.querySelectorAll("[data-g][data-n]")].filter(el => el.closest("[data-sec]") === sec);
      const vis = own.filter(el => !el.hidden);
      let note = sec.querySelector(".empty-note");
      const empty = on && own.length && !vis.length;
      if (empty && !note) { note = document.createElement("p"); note.className = "empty-note"; note.textContent = "Ennél a szállítónál nincs ilyen tétel."; const b = boxes(sec)[0]; if (b) b.before(note); }
      if (note) note.hidden = !empty;
      boxes(sec).forEach(b => b.hidden = !!empty);
      if (sec.tagName === "DETAILS") sec.open = on ? vis.length > 0 : openState.get(sec);
      if (on && vis.length) parts.push(`<b>${vis.length}</b> ${sec.dataset.sec} (${ft(vis.reduce((a,el)=>a+Number(el.dataset.a||0),0))})`);
    });
    view.querySelectorAll("details.sec:not([data-sec])").forEach(d => {
      if (!openState.has(d)) openState.set(d, d.open);
      d.open = on ? [...d.querySelectorAll("[data-g][data-n]")].some(el => !el.hidden) : openState.get(d);
    });
    res.hidden = !on;
    res.innerHTML = on ? (parts.length ? parts.join(" · ") : "Nincs találat. Próbáld a név egy részével, pl. csak „Gledicia”.") : "";
    try { on ? sessionStorage.setItem(key, raw) : sessionStorage.removeItem(key); } catch(e) {}
  }
  q.addEventListener("input", apply);
  clr.addEventListener("click", () => { q.value = ""; apply(); q.focus(); });
  view.querySelectorAll("td.c").forEach(td => {
    td.title = "Szűrés erre a szállítóra";
    td.addEventListener("click", () => { const tr = td.closest("[data-g]"); if (!tr) return;
      q.value = U.groups[+tr.dataset.g] || tr.dataset.n; apply(); q.scrollIntoView({block:"nearest"}); });
  });
  try { const v = sessionStorage.getItem(key); if (v) { q.value = v; apply(); } } catch(e) {}
}

function detailTable(d){
  const M = d.months, qs = d.quarters;
  const qv = (k, q) => M.filter(m=>Math.floor((m.m-1)/3)===q).reduce((a,m)=>a+m[k],0);
  const row = (lbl, k, cls="") => `<tr class="${cls}"><td class="lbl">${lbl}</td>${qs.map(Q=>`<td class="hide-n">${nf(qv(k,Q.q))}</td>`).join("")}<td>${nf(M.reduce((a,m)=>a+m[k],0))}</td></tr>`;
  const L = Object.fromEntries(d.lines);
  const costKeys = d.lines.slice(2).map(x=>x[0]).filter(k => M.some(m=>m[k]));
  return `<div class="tbl"><table>
    <thead><tr><th>Sor</th>${qs.map(Q=>`<th class="hide-n">${QN[Q.q]} n.év</th>`).join("")}<th>Összesen</th></tr></thead>
    <tbody>
      ${row("Bevételek összesen","bev","grp")}
      ${row(L.arbev,"arbev","sub2")}${M.some(m=>m.egybev)?row(L.egybev,"egybev","sub2"):""}
      ${row("Költségek, ráfordítások","kolt","grp")}
      ${costKeys.map(k=>row(L[k],k,"sub2")).join("")}
    </tbody>
    <tfoot><tr><td class="lbl">Eredmény adózás előtt</td>${qs.map(Q=>{const v=qv("ered",Q.q);return `<td class="hide-n${v<0?" neg":""}">${nf(v)}</td>`;}).join("")}<td${neg(d.ytd.ered)}>${nf(d.ytd.ered)}</td></tr></tfoot>
  </table></div>`;
}

function wireCopy(root){
  root.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    const t = b.dataset.copy, old = b.textContent;
    try { await navigator.clipboard.writeText(t); b.textContent = "Másolva"; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "Kijelölve"; }
    setTimeout(() => b.textContent = old, 1500);
  }));
}

function drawChart(d){
  const el = document.getElementById("chart"); if (!el) return;
  const ms = d.months;
  const W = Math.max(320, Math.min(900, el.clientWidth || 760)), narrow = W < 560;
  const H = narrow ? 220 : 260, L = narrow ? 40 : 56, R = 6, T = 14, B = 28;
  const max = Math.max(...ms.flatMap(m=>[m.bev, m.kolt]), 1);
  const step = [100000,200000,250000,500000,1e6,2e6,2.5e6,5e6,1e7,2e7,5e7,1e8].find(s=>max/s<=5) || 2e8;
  const top = Math.ceil(max/step)*step;
  const y = v => T + (H-T-B)*(1-Math.max(0,v)/top);
  const bw = (W-L-R)/ms.length, w = Math.max(3, Math.min(18, (bw-8)/2));
  const fmt = v => v===0 ? "0" : v>=1e6 ? (v/1e6).toLocaleString("hu-HU")+" M" : (v/1e3).toLocaleString("hu-HU")+" e";
  const bar = (x, v, col) => { const h = Math.max(0, y(0)-y(v)); if (h<=0) return ""; const r = Math.min(4, h/2, w/2), y0 = y(v);
    return `<path d="M${x},${y(0)} V${y0+r} Q${x},${y0} ${x+r},${y0} H${x+w-r} Q${x+w},${y0} ${x+w},${y0+r} V${y(0)} Z" fill="${col}"/>`; };
  let g = "";
  for(let v=0; v<=top+1; v+=step){
    g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-num)">${fmt(v)}</text>`;
  }
  ms.forEach((m,k)=>{
    const cx = L + bw*k + bw/2;
    g += `<g class="b" data-k="${k}" tabindex="0"><rect x="${L+bw*k}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>${bar(cx-w-1, m.bev, "var(--s1)")}${bar(cx+1, m.kolt, "var(--s2)")}<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="${narrow?10:11.5}" fill="var(--ink-2)">${narrow?m.m:HU_M[m.m-1]}</text></g>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Havi bevétel és ráfordítás oszlopdiagram">${g}</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.querySelectorAll("g.b").forEach(b=>{
    const k = +b.dataset.k, m = ms[k];
    const show = ()=>{ const s = svg.getBoundingClientRect().width/W;
      tip.innerHTML = `<b>${HU_MF[m.m-1]}</b><br>Bevétel <span class="num">${ft(m.bev)}</span><br>Ráfordítás <span class="num">${ft(m.kolt)}</span><br>Eredmény <span class="num">${ft(m.ered)}</span>`;
      const x = Math.min(Math.max((L+bw*k+bw/2)*s, 90), svg.getBoundingClientRect().width-90);
      tip.style.left = x+"px"; tip.style.top = y(Math.max(m.bev,m.kolt))*s+"px"; tip.hidden = false; };
    b.addEventListener("mouseenter", show); b.addEventListener("focus", show); b.addEventListener("click", show);
    b.addEventListener("mouseleave", ()=>tip.hidden = true); b.addEventListener("blur", ()=>tip.hidden = true);
  });
}
if (PAYLOAD.plain) { document.getElementById("lock").hidden = true; render(PAYLOAD.plain); }

// széles táblázatoknál a vízszintes csúszka a táblázat tetején is megjelenik, a kettő együtt mozog
function topScrollbars(root){
  root.querySelectorAll(".tbl").forEach(t => {
    if (t.previousElementSibling?.classList.contains("tscroll")) return;
    const top = document.createElement("div"); top.className = "tscroll"; top.hidden = true;
    const inner = document.createElement("div"); top.appendChild(inner);
    t.parentNode.insertBefore(top, t);
    let lock = false;
    top.addEventListener("scroll", () => { if (lock) { lock = false; return; } lock = true; t.scrollLeft = top.scrollLeft; });
    t.addEventListener("scroll", () => { if (lock) { lock = false; return; } lock = true; top.scrollLeft = t.scrollLeft; });
    const fit = () => { const w = t.scrollWidth, c = t.clientWidth; top.hidden = !c || w <= c + 1; inner.style.width = w + "px"; top.scrollLeft = t.scrollLeft; };
    try { new ResizeObserver(fit).observe(t); const tb = t.querySelector("table"); if (tb) new ResizeObserver(fit).observe(tb); } catch (e) { window.addEventListener("resize", fit); }
    fit();
  });
}
